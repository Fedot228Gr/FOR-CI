function pickWeightedCard(excludeIds) {
  const exclude = excludeIds || new Set();
  let totalW = 0;
  const weights = [];
  for (const card of ALL_CARDS) {
    if (exclude.has(card.id)) continue;
    const seen = G.cardsSinceSeen[card.id] || 0;
    const w = 1 + Math.min(4, seen);
    weights.push({ card, w });
    totalW += w;
  }
  if (weights.length === 0) return ALL_CARDS[0];
  let r = Math.random() * totalW;
  for (const { card, w } of weights) {
    r -= w;
    if (r <= 0) return card;
  }
  return weights[weights.length - 1].card;
}

function drawHand() {
  G.hand = [];
  const used = new Set();
  for (let i = 0; i < HAND_SIZE; i++) {
    const card = pickWeightedCard(used);
    G.hand.push(card);
    used.add(card.id);
  }
  for (const card of ALL_CARDS) {
    if (used.has(card.id)) {
      G.cardsSinceSeen[card.id] = 0;
    } else {
      G.cardsSinceSeen[card.id] = (G.cardsSinceSeen[card.id] || 0) + 1;
    }
  }
  G.selectedIndex = -1;
}

function applyUpgradesToUnit(u) {
  const base = ALL_CARDS.find(c => c.id === u.kind);
  if (!base) return;
  const ups = G.kindUpgrades[u.kind] || {};
  const hpMul = G.upgrades.hpMul || 0;
  const newMaxHp = Math.round(base.hp * (1 + hpMul) + (ups.hp || 0));
  const hpRatio = u.maxHp > 0 ? Math.max(0, u.hp) / u.maxHp : 1;
  u.maxHp = newMaxHp;
  u.hp = Math.max(1, Math.round(newMaxHp * hpRatio));
  u.baseDamage = base.damage + (ups.damage || 0);
  u.damage = u.baseDamage;
  u.range  = base.range  + (ups.range  || 0);
  u.cooldown = Math.max(0.2, base.cooldown * (1 + (ups.cooldownMul || 0)));
  if (u.kind === 'archer') u.accuracy = Math.min(1, BASE_ARCHER_ACCURACY + (ups.accuracy || 0));
  if (u.kind === 'bomb') u.aoe = BOMB_AOE + (ups.aoe || 0);
  if (u.kind === 'mortar') u.aoe = (base.aoe || BOMB_AOE) + (ups.aoe || 0);
  if (u.kind === 'healer') u.heal = (base.heal || 0) + (ups.heal || 0);
  if (u.kind === 'shepherd') {
    u.auraDmg = SHEPHERD_BASE_AURA + (ups.auraDmg || 0);
    u.auraRange = SHEPHERD_AURA_RANGE + (ups.auraRange || 0);
  }
}

function makeCombatant(x, y, cfg, team) {
  const ups = G.kindUpgrades[cfg.kind] || {};
  const hpMul = G.upgrades.hpMul || 0;
  const finalHp = Math.round(cfg.hp * (1 + hpMul) + (ups.hp || 0));
  return {
    x, y, team,
    kind: cfg.kind || 'goblin',
    hp: finalHp, maxHp: finalHp,
    damage: cfg.damage,
    baseDamage: cfg.damage,
    range: cfg.range, cooldown: cfg.cooldown,
    speed: cfg.speed || 0,
    accuracy: cfg.kind === 'archer' ? Math.min(1, BASE_ARCHER_ACCURACY + (ups.accuracy || 0)) : 1,
    aoe: cfg.aoe || 0, heal: cfg.heal || 0,
    auraDmg: cfg.kind === 'shepherd' ? SHEPHERD_BASE_AURA : 0,
    auraRange: cfg.kind === 'shepherd' ? SHEPHERD_AURA_RANGE : 0,
    lastAttack: 0, gridCell: null,
    flashUntil: 0, dead: false, dying: false,
    spawnT: SPAWN_DUR, attackT: 0, deathT: 0,
    kbX: 0, kbY: 0, kbT: 0,
    walkPhase: Math.random() * 10, moving: false, dustT: 0,
    lastStepIdx: 0,
    stuckArrows: [],
    buffGlowUntil: 0
  };
}

function rollUpgradeChoices() {
  const available = UPGRADE_CARDS.filter(card => {
    if (card.kind === 'all') return true;
    if (card.kind === 'gold') return true;
    if (card.kind === 'castle') return true;
    const ups = G.kindUpgrades[card.kind];
    if (!ups) return false;
    if (card.effect.accuracy) return (BASE_ARCHER_ACCURACY + ups.accuracy + card.effect.accuracy) <= 1.0001;
    return true;
  });
  const shuffled = available.slice();
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled.slice(0, 3);
}

function applyUpgrade(card) {
  if (card.kind === 'all') G.upgrades.hpMul += card.effect.hpMul || 0;
  else if (card.kind === 'gold') G.upgrades.goldBonus += card.effect.goldBonus || 0;
  else if (card.kind === 'castle') {
    G.castleDamage += card.effect.castleDmg || 0;
    G.castleCooldown = Math.max(0.2, G.castleCooldown * (1 - (card.effect.castleRate || 0)));
  } else {
    const ups = G.kindUpgrades[card.kind];
    if (!ups) return;
    ups.damage += card.effect.damage || 0;
    ups.hp += card.effect.hp || 0;
    ups.range += card.effect.range || 0;
    ups.cooldownMul += card.effect.cooldownMul || 0;
    ups.accuracy += card.effect.accuracy || 0;
    ups.aoe += card.effect.aoe || 0;
    ups.heal += card.effect.heal || 0;
    ups.auraDmg += card.effect.auraDmg || 0;
    ups.auraRange += card.effect.auraRange || 0;
  }
  G.upgradeCount[card.id] = (G.upgradeCount[card.id] || 0) + 1;
  for (const u of G.units) if (u.team === 'player') applyUpgradesToUnit(u);
  
  const colorByKind = { sword:'#c0392b', archer:'#27ae60', mage:'#8e44ad', wall:'#8e5a3b', bomb:'#d35400', spearman:'#f39c12', assassin:'#2c3e50', healer:'#1abc9c', fanatic:'#641e16', shepherd:'#f1c40f', strelets:'#e74c3c', tower:'#7f8c8d', mortar:'#95a5a6', all:'#facc15', gold:'#fbbf24', castle:'#fde047' };
  spawnUpgradeText(card.icon + ' ' + card.name, colorByKind[card.kind] || '#facc15');
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const p = toLogical(e.clientX, e.clientY);
  handleTap(p.x, p.y);
}, { passive: false });

function handleTap(x, y) {
  if (G.phase === 'defeat') return;
  if (G.scene === 'menu') {
    const M = menuLayout();
    // Выбор сложности (три варианта)
    for (const r of M.diffs) {
      if (inRect(x, y, r.x, r.y, r.w, r.h)) {
        selectedDifficulty = r.id;
        menuBtnPressed = 'diff:' + r.id;
        setTimeout(() => { if (menuBtnPressed === 'diff:' + r.id) menuBtnPressed = null; }, 140);
        return;
      }
    }
    const pb = M.play;
    if (inRect(x, y, pb.x, pb.y, pb.w, pb.h)) {
      menuBtnPressed = 'play';
      G.scene = 'game'; resetGame();
      setTimeout(() => { if (menuBtnPressed === 'play') menuBtnPressed = null; }, 160);
    }
    return;
  }
  if (G.scene === 'over') {
    const ob = overBtnRect();
    if (inRect(x, y, ob.x, ob.y, ob.w, ob.h)) { G.scene = 'game'; resetGame(); }
    return;
  }
  if (G.phase === 'upgrade') {
    for (let i = 0; i < G.upgradeCardRects.length; i++) {
      const r = G.upgradeCardRects[i];
      if (inRect(x, y, r.x, r.y, r.w, r.h)) { chooseUpgrade(i); return; }
    }
    return;
  }
  if (G.phase === 'prep') {
    const b = LAYOUT.btn;
    if (inRect(x, y, b.x, b.y, b.w, b.h)) { startBattle(); return; }
    
    const rb = LAYOUT.rerollBtn;
    if (inRect(x, y, rb.x, rb.y, rb.w, rb.h)) {
      const rc = G_DIFF ? G_DIFF.rerollCost : REROLL_COST;
      if (G.gold >= rc) {
        G.gold -= rc;
        drawHand();
        G.infoText = 'Рука обновлена!';
      } else {
        G.infoText = 'Нужно ' + rc + ' золота';
      }
      return;
    }
    
    for (let i = 0; i < G.hand.length; i++) {
      const r = getCardRect(i);
      const lift = i === G.selectedIndex ? -10 : 0;
      if (inRect(x, y, r.x, r.y + lift, r.w, r.h)) { selectCard(i); return; }
    }
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const gx = GRID_X + c * CELL, gy = GRID_Y + r * CELL;
        if (inRect(x, y, gx, gy, CELL, CELL) && !G.grid[r][c]) { onCellClick(r, c); return; }
      }
    }
  }
}

function chooseUpgrade(index) {
  const card = G.offeredUpgrades[index];
  if (!card) return;
  applyUpgrade(card);
  G.offeredUpgrades = []; G.upgradeCardRects = [];
  G.phase = 'prep';
  G.infoText = card.name + ' — применено!';
}

function selectCard(index) {
  if (G.phase !== 'prep') return;
  const card = G.hand[index];
  if (G.gold < card.cost) { G.infoText = 'Не хватает золота'; return; }
  G.selectedIndex = G.selectedIndex === index ? -1 : index;
  G.infoText = G.selectedIndex >= 0 ? 'Выберите клетку на поле' : '';
}

function onCellClick(r, c) {
  if (G.phase !== 'prep' || G.selectedIndex < 0 || G.grid[r][c]) return;
  const card = G.hand[G.selectedIndex];
  if (G.gold < card.cost) return;
  G.gold -= card.cost;
  const x = GRID_X + c * CELL + CELL / 2;
  const y = GRID_Y + r * CELL + CELL / 2;
  const u = makeCombatant(x, y, { kind: card.id, hp: card.hp, damage: card.damage, range: card.range, cooldown: card.cooldown, speed: card.speed, aoe: card.aoe, heal: card.heal }, 'player');
  u.gridCell = { r, c };
  G.units.push(u); G.grid[r][c] = u;
  spawnSpawnRing(x, y + 32);
  const newCard = pickWeightedCard();
  G.hand[G.selectedIndex] = newCard;
  G.cardsSinceSeen[newCard.id] = 0;
  G.selectedIndex = -1;
  G.infoText = '';
}

function startBattle() {
  if (G.phase !== 'prep') return;
  if (G.units.length === 0) { G.infoText = 'Поставьте хотя бы одного бойца!'; return; }
  G.phase = 'battle';
  G.selectedIndex = -1;
  G.wave++;
  
  const special = SPECIAL_WAVES[G.wave];
  const si = G_DIFF ? G_DIFF.spawnInterval : 700;
  if (special) {
    let types = special.types;
    // На тяжёлой сложности спец-волны приходят с подкреплением
    if (G_DIFF && G_DIFF.id === 'hard') types = types.concat(types.slice(0, Math.ceil(types.length / 3)));
    G.pendingSpawns = types.length;
    for (let i = 0; i < types.length; i++) {
      setTimeout(() => spawnEnemy(types[i]), 500 + i * si);
    }
    G.gold += special.bonusGold;
    G.infoText = special.name + '! +' + special.bonusGold + '💰';
  } else {
    const count = (G_DIFF ? G_DIFF.enemyCountBase : 3) + G.wave;
    G.pendingSpawns = count;
    for (let i = 0; i < count; i++) {
      setTimeout(() => spawnEnemy(), 500 + i * si);
    }
    G.infoText = 'Нашествие! Волна ' + G.wave;
  }
}

function pickEnemyType(wave) {
  const pool = [];
  for (const [id, cfg] of Object.entries(ENEMY_TYPES)) {
    if (wave < cfg.minWave) continue;
    const w = Math.min(8, 2 + (wave - cfg.minWave));
    pool.push({ id, weight: w });
  }
  if (pool.length === 0) return 'goblin';
  const total = pool.reduce((s, p) => s + p.weight, 0);
  let r = Math.random() * total;
  for (const p of pool) { r -= p.weight; if (r <= 0) return p.id; }
  return pool[0].id;
}

function spawnEnemy(forceType) {
  if (G.phase !== 'battle') return;
  G.pendingSpawns = Math.max(0, G.pendingSpawns - 1);
  const type = forceType || pickEnemyType(G.wave);
  const cfg = ENEMY_TYPES[type];
  const hpMul = G_DIFF ? G_DIFF.enemyHpMul : 1;
  const dmgMul = G_DIFF ? G_DIFF.enemyDmgMul : 1;
  const hp = Math.round((cfg.hp + G.wave * cfg.hpWave) * hpMul);
  const damage = Math.round((cfg.dmg + G.wave * cfg.dmgWave) * dmgMul);
  const row = rndInt(0, ROWS - 1);
  const y = GRID_Y + row * CELL + CELL / 2;
  const spawnX = ARENA_X + ARENA_W - 30;
  const e = makeCombatant(spawnX, y, {
    kind: type, hp, damage, range: cfg.range, cooldown: cfg.cooldown, speed: cfg.speed
  }, 'enemy');
  G.enemies.push(e);
  spawnSpawnRing(spawnX, y + 32);
}

let lastT = 0;
function loop(t) {
  if (!lastT) lastT = t;
  let dt = (t - lastT) / 1000;
  if (dt > 0.1) dt = 0.1;
  lastT = t;
  G.time = t / 1000;

  let updateDt = dt;
  if (G.phase === 'defeat') {
    updateDt = dt * 0.35;
    G.defeatT -= dt;
    if (G.defeatT <= 0) {
      G.phase = 'over';
      G.win = false;
      G.scene = 'over';
    }
  }

  update(updateDt, dt);
  render(dt);
  requestAnimationFrame(loop);
}

function update(dt, realDt) {
  if (G.scene !== 'game') return;
  if (G.phase === 'defeat') {
    updateParticles(dt); updateBodyParts(dt); updateSplatters(dt);
    updateFloatingTexts(dt);
    return;
  }
  for (const u of G.units) tickUnitTimers(u, dt);
  for (const e of G.enemies) tickUnitTimers(e, dt);
  for (const u of G.units) if (u.stuckArrows) for (const sa of u.stuckArrows) sa.age = (sa.age || 0) + dt;
  for (const e of G.enemies) if (e.stuckArrows) for (const sa of e.stuckArrows) sa.age = (sa.age || 0) + dt;
  updateParticles(dt);
  updateBodyParts(dt);
  updateSplatters(dt);
  updateProjectiles(dt);
  updateStreams(dt);
  updateFloatingTexts(dt);
  if (G.phase !== 'battle') return;

  G.castleAttackCd -= dt;
  if (G.castleAttackCd <= 0 && G.enemies.length > 0) {
    const startX = CASTLE_X + CASTLE_W * 0.5;
    const startY = CASTLE_TOP - 28;
    const target = findNearestFromPoint(startX, startY, G.enemies);
    if (target && dist(startX, startY, target.x, target.y) <= CASTLE_ARROW_RANGE) {
      shootCastleArrow(target);
      G.castleAttackCd = G.castleCooldown;
      G.castleArrowFlashUntil = G.time + 0.15;
    }
  }

  for (const u of G.units) updateUnit(u, dt, G.enemies);
  for (const e of G.enemies) updateUnit(e, dt, G.units);
  
  for (const u of G.units) {
    if (u.team === 'player' && !u.dead && !u.dying) {
      const minX = ARENA_X + 30;
      const maxX = ARENA_X + ARENA_W - 30;
      const minY = ARENA_Y + 30;
      const maxY = ARENA_Y + ARENA_H - 30;
      if (u.x < minX) u.x = minX;
      if (u.x > maxX) u.x = maxX;
      if (u.y < minY) u.y = minY;
      if (u.y > maxY) u.y = maxY;
    }
  }
  
  G.units = G.units.filter(u => !u.dead);
  G.enemies = G.enemies.filter(e => !e.dead);
  for (const fx of G.effects) fx.life -= dt;
  G.effects = G.effects.filter(fx => fx.life > 0);
  if (G.enemies.length === 0 && G.pendingSpawns === 0) onWaveCleared();
}

function findNearestFromPoint(x, y, list) {
  let best = null, bestD = Infinity;
  for (const t of list) {
    if (t.dead || t.dying) continue;
    const d = dist(x, y, t.x, t.y);
    if (d < bestD) { bestD = d; best = t; }
  }
  return best;
}

function shootCastleArrow(target) {
  const startX = CASTLE_X + CASTLE_W * 0.5;
  const startY = CASTLE_TOP - 28;
  const dx = target.x - startX;
  const dy = (target.y - 20) - startY;
  const angle = Math.atan2(dy, dx);
  G.projectiles.push({
    type: 'arrow', castle: true,
    x: startX, y: startY,
    vx: Math.cos(angle) * ARROW_SPEED * 0.9,
    vy: Math.sin(angle) * ARROW_SPEED * 0.9,
    target, targetX: target.x, targetY: target.y - 20,
    speed: ARROW_SPEED * 0.9,
    damage: G.castleDamage, team: 'player',
    attacker: null,
    rotation: angle, alive: true, age: 0, trailT: 0, willHit: true
  });
}

function tickUnitTimers(u, dt) {
  if (u.spawnT > 0) u.spawnT = Math.max(0, u.spawnT - dt);
  if (u.attackT > 0) u.attackT = Math.max(0, u.attackT - dt);
  if (u.kbT > 0) { u.kbT = Math.max(0, u.kbT - dt); if (u.kbT <= 0) { u.kbX = 0; u.kbY = 0; } }
  if (u.dying) { u.deathT -= dt; if (u.deathT <= 0) u.dead = true; }
}

function updateUnit(u, dt, enemies) {
  if (u.dead || u.dying) { u.moving = false; return; }
  const isEnemy = u.team === 'enemy';

  if (!isEnemy && u.baseDamage !== undefined) {
    let effDmg = u.baseDamage;
    let buffed = false;
    if (u.baseDamage > 0 && u.kind !== 'shepherd') {
      for (const a of G.units) {
        if (a !== u && a.kind === 'shepherd' && !a.dead && !a.dying) {
          const ar = a.auraRange || SHEPHERD_AURA_RANGE;
          if (dist(u.x, u.y, a.x, a.y) <= ar) {
            effDmg += (a.auraDmg || SHEPHERD_BASE_AURA);
            buffed = true;
            break;
          }
        }
      }
    }
    if (u.kind === 'fanatic') {
      const hasShepherd = G.units.some(a => a.kind === 'shepherd' && !a.dead && !a.dying);
      if (hasShepherd) {
        effDmg += FANATIC_SHEPHERD_BONUS;
        buffed = true;
      }
    }
    u.damage = effDmg;
    if (buffed) u.buffGlowUntil = G.time + 0.1;
  }

  if (u.kind === 'healer') {
    const allies = G.units.filter(a => a !== u && !a.dead && !a.dying && a.hp < a.maxHp);
    if (allies.length === 0) { u.moving = false; return; }
    let nearest = null, nearestD = Infinity;
    for (const a of allies) {
      const d = dist(u.x, u.y, a.x, a.y);
      if (d < nearestD) { nearestD = d; nearest = a; }
    }
    if (!nearest) { u.moving = false; return; }
    if (nearestD <= u.range) {
      u.moving = false;
      if (G.time - u.lastAttack >= u.cooldown) {
        u.lastAttack = G.time;
        u.attackT = ATK_DUR;
        const healAmt = u.heal || 20;
        nearest.hp = Math.min(nearest.maxHp, nearest.hp + healAmt);
        nearest.healGlowUntil = G.time + 0.6;
        spawnHealBurst(nearest.x, nearest.y);
        spawnDamageNumber(nearest.x, nearest.y, healAmt, true, 75);
        G.effects.push({
          type: 'line',
          x1: u.x, y1: u.y - 20, x2: nearest.x, y2: nearest.y - 20,
          color: 'rgba(26, 188, 156, 0.9)', life: 0.4, maxLife: 0.4
        });
      }
    } else if (u.speed > 0) {
      u.moving = true;
      u.walkPhase += dt * 9;
      const a = Math.atan2(nearest.y - u.y, nearest.x - u.x);
      u.x += Math.cos(a) * u.speed * dt;
      u.y += Math.sin(a) * u.speed * dt;
      u.dustT -= dt;
      if (u.dustT <= 0) { u.dustT = 0.13; spawnDust(u.x, u.y + 32); }
    } else { u.moving = false; }
    return;
  }

  const target = findNearest(u, enemies);

  if (!target && isEnemy) {
    const dx = CASTLE_CX - u.x;
    const dy = CASTLE_CY - u.y;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d <= CASTLE_ATTACK_RANGE) {
      u.moving = false;
      if (G.time - u.lastAttack >= u.cooldown) {
        u.lastAttack = G.time;
        u.attackT = ATK_DUR;
        damageCastle(u.damage, u);
      }
    } else if (u.speed > 0) {
      u.moving = true;
      u.walkPhase += dt * 9;
      const a = Math.atan2(dy, dx);
      u.x += Math.cos(a) * u.speed * dt;
      u.y += Math.sin(a) * u.speed * dt;
      u.dustT -= dt;
      if (u.dustT <= 0) { u.dustT = 0.13; spawnDust(u.x, u.y + 32); }
    }
    return;
  }

  if (!target) { u.moving = false; return; }
  const d = dist(u.x, u.y, target.x, target.y);
  if (d <= u.range) {
    u.moving = false;
    if (u.damage > 0 && G.time - u.lastAttack >= u.cooldown) {
      u.lastAttack = G.time;
      u.attackT = ATK_DUR;
      if (u.kind === 'bomb' || u.kind === 'mortar') scheduleProjectileAttack(u, target, 'bomb');
      else if (u.kind === 'archer' || u.kind === 'tower') scheduleProjectileAttack(u, target, 'arrow');
      else if (u.kind === 'mage') scheduleProjectileAttack(u, target, 'magic');
      else if (u.kind === 'shaman') scheduleProjectileAttack(u, target, 'shadowbolt');
      else if (u.kind === 'strelets') scheduleProjectileAttack(u, target, 'bullet');
      else dealDamage(u, target);
    }
  } else if (u.speed > 0) {
    u.moving = true;
    u.walkPhase += dt * 9;
    const stepIdx = Math.floor(u.walkPhase / Math.PI);
    if (stepIdx !== u.lastStepIdx) {
      u.lastStepIdx = stepIdx;
      spawnDust(u.x + (Math.random() - 0.5) * 8, u.y + 32);
    }
    const a = Math.atan2(target.y - u.y, target.x - u.x);
    u.x += Math.cos(a) * u.speed * dt;
    u.y += Math.sin(a) * u.speed * dt;
  } else { u.moving = false; }
}

function damageCastle(amount, attacker) {
  G.castleHp = Math.max(0, G.castleHp - amount);
  G.castleFlashUntil = G.time + 0.25;
  G.screenShake = 0.4;
  const hitX = CASTLE_CX;
  const hitY = attacker.y;
  for (let i = 0; i < 12; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 80 + Math.random() * 120;
    spawnParticle(hitX, hitY, Math.cos(a) * sp, Math.sin(a) * sp - 60, choice(['#94a3b8', '#64748b', '#475569']), 0.6, 3 + Math.random() * 3, 'front', 350);
  }
  if (G.castleHp <= 0 && G.phase !== 'defeat') triggerDefeat();
}

function triggerDefeat() {
  G.phase = 'defeat';
  G.defeatT = 2.5;
  G.screenShake = 1.0;
  spawnExplosion(CASTLE_X, CASTLE_CY);
  for (let i = 0; i < 25; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 100 + Math.random() * 250;
    G.bodyParts.push({
      x: CASTLE_X + (Math.random()-0.5)*30,
      y: CASTLE_CY + (Math.random()-0.5)*150,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 200,
      gravity: 600, rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random()-0.5) * 12,
      part: PART_CONFIGS.wall.brick, partType: 'brick',
      life: 5, maxLife: 5,
      groundY: CASTLE_BOTTOM + (Math.random()-0.5)*10,
      bounces: 0, landed: false, bloodied: false
    });
  }
  G.infoText = 'Детинец пал...';
}

function scheduleProjectileAttack(attacker, target, type) {
  const delay = ATK_DUR * 500;
  setTimeout(() => {
    if (attacker.dying || attacker.dead) return;
    if (!target || target.dead || target.dying) return;
    if (type === 'bomb') throwBomb(attacker, target);
    else if (type === 'arrow') shootArrow(attacker, target);
    else if (type === 'magic') castMagic(attacker, target);
    else if (type === 'shadowbolt') castShadowbolt(attacker, target);
    else if (type === 'bullet') shootBullet(attacker, target);
  }, delay);
}

function throwBomb(attacker, target) {
  const facing = attacker.team === 'enemy' ? -1 : 1;
  const startX = attacker.x + facing * 26;
  const startY = attacker.y + 35 - 34;
  G.projectiles.push({
    type: 'bomb', x: startX, y: startY,
    target, targetX: target.x, targetY: target.y - 20,
    speed: 480, damage: attacker.damage, team: attacker.team,
    aoe: attacker.aoe || BOMB_AOE,
    rotation: Math.random() * Math.PI * 2, rotSpeed: 10 + Math.random() * 4,
    trailT: 0, alive: true, age: 0
  });
}

function shootArrow(attacker, target) {
  const facing = attacker.team === 'enemy' ? -1 : 1;
  const startX = attacker.x + facing * 30;
  const startY = attacker.y + 35 - 42;
  const acc = attacker.accuracy !== undefined ? attacker.accuracy : BASE_ARCHER_ACCURACY;
  const willHit = Math.random() < acc;
  const dx = target.x - startX, dy = (target.y - 20) - startY;
  let angle = Math.atan2(dy, dx);
  if (!willHit) angle += (Math.random() - 0.5) * 0.5;
  G.projectiles.push({
    type: 'arrow', x: startX, y: startY,
    vx: Math.cos(angle) * ARROW_SPEED, vy: Math.sin(angle) * ARROW_SPEED,
    target: willHit ? target : null,
    targetX: target.x, targetY: target.y - 20,
    speed: ARROW_SPEED, damage: attacker.damage, team: attacker.team, attacker,
    rotation: angle, alive: true, age: 0, trailT: 0, willHit
  });
}

function shootBullet(attacker, target) {
  const facing = attacker.team === 'enemy' ? -1 : 1;
  const startX = attacker.x + facing * 32;
  const startY = attacker.y + 35 - 42;
  const dx = target.x - startX, dy = (target.y - 20) - startY;
  const angle = Math.atan2(dy, dx);
  
  // Пороховой дым
  for (let i = 0; i < 5; i++) {
    spawnParticle(startX, startY, Math.cos(angle + (Math.random()-0.5))*60, Math.sin(angle + (Math.random()-0.5))*60 - 20, 'rgba(189, 195, 199, 0.6)', 0.4, 4 + Math.random()*4, 'front', -20);
  }
  
  G.projectiles.push({
    type: 'bullet', x: startX, y: startY,
    vx: Math.cos(angle) * 1500, vy: Math.sin(angle) * 1500,
    target: target,
    targetX: target.x, targetY: target.y - 20,
    speed: 1500, damage: attacker.damage, team: attacker.team, attacker,
    rotation: angle, alive: true, age: 0, trailT: 0, willHit: true
  });
}

function castMagic(attacker, target) {
  const facing = attacker.team === 'enemy' ? -1 : 1;
  const startX = attacker.x + facing * 22;
  const startY = attacker.y + 35 - 80;
  G.streams.push({
    type: 'magic', startX, startY, target,
    life: 0.35, maxLife: 0.35, seed: Math.random() * 1000,
    team: attacker.team, damage: attacker.damage
  });
  applyDamage(target, attacker.damage, attacker.x, attacker.y, attacker.team, false);
  spawnMagicImpact(target.x, target.y - 20);
}

function castShadowbolt(attacker, target) {
  const startX = attacker.x - 15;
  const startY = attacker.y + 35 - 55;
  G.projectiles.push({
    type: 'shadowbolt', x: startX, y: startY,
    target, speed: 340,
    damage: attacker.damage, team: attacker.team,
    trailT: 0, alive: true, age: 0
  });
}

function updateProjectiles(dt) {
  for (const p of G.projectiles) {
    if (!p.alive) continue;
    p.age += dt;
    if (p.type === 'bomb') updateBomb(p, dt);
    else if (p.type === 'arrow') updateArrow(p, dt);
    else if (p.type === 'shadowbolt') updateShadowbolt(p, dt);
    else if (p.type === 'bullet') updateBullet(p, dt);
  }
  G.projectiles = G.projectiles.filter(p => p.alive);
}

function updateBomb(p, dt) {
  p.rotation += p.rotSpeed * dt;
  if (p.target && !p.target.dead && !p.target.dying) {
    p.targetX = p.target.x; p.targetY = p.target.y - 20;
  }
  const dx = p.targetX - p.x, dy = p.targetY - p.y;
  const d = Math.sqrt(dx * dx + dy * dy);
  if (d < 16) { p.x = p.targetX; p.y = p.targetY; explodeBomb(p); p.alive = false; return; }
  const step = p.speed * dt;
  if (d <= step) { p.x = p.targetX; p.y = p.targetY; }
  else { p.x += (dx / d) * step; p.y += (dy / d) * step; }
  p.trailT -= dt;
  if (p.trailT <= 0) {
    p.trailT = 0.035;
    spawnParticle(p.x, p.y, (Math.random() - 0.5) * 25, (Math.random() - 0.5) * 25, 'rgba(148,163,184,0.65)', 0.35, 2.5, 'back', -20);
  }
}

function updateArrow(p, dt) {
  if (p.willHit && p.target && !p.target.dead && !p.target.dying) {
    p.targetX = p.target.x; p.targetY = p.target.y - 20;
    const curAngle = Math.atan2(p.vy, p.vx);
    const toAngle = Math.atan2(p.targetY - p.y, p.targetX - p.x);
    let diff = toAngle - curAngle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    const maxTurn = ARROW_TURN * dt;
    const turn = Math.max(-maxTurn, Math.min(maxTurn, diff));
    const newAngle = curAngle + turn;
    p.vx = Math.cos(newAngle) * p.speed;
    p.vy = Math.sin(newAngle) * p.speed;
    p.rotation = newAngle;
  }
  const step = p.speed * dt;
  p.x += Math.cos(p.rotation) * step;
  p.y += Math.sin(p.rotation) * step;
  p.trailT -= dt;
  if (p.trailT <= 0) {
    p.trailT = 0.06;
    const trailColor = p.castle ? 'rgba(250, 204, 21, 0.5)' : 'rgba(226,232,240,0.35)';
    spawnParticle(p.x, p.y, (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10, trailColor, 0.25, 1.5, 'back', -10);
  }
  if (p.willHit && p.target && !p.target.dead && !p.target.dying) {
    const d = dist(p.x, p.y, p.target.x, p.target.y - 20);
    if (d < 24) { stickArrowInto(p, p.target); return; }
  }
  if (!p.willHit) {
    if (p.age > 1.5) { p.alive = false; spawnMissSpark(p.x, p.y); }
    if (p.x < -80 || p.x > W + 80 || p.y < -80 || p.y > H + 80) p.alive = false;
  } else if (!p.target || p.target.dead || p.target.dying) {
    if (p.age > 2) { p.alive = false; spawnMissSpark(p.x, p.y); }
  }
}

function updateBullet(p, dt) {
  const step = p.speed * dt;
  p.x += Math.cos(p.rotation) * step;
  p.y += Math.sin(p.rotation) * step;
  
  p.trailT -= dt;
  if (p.trailT <= 0) {
    p.trailT = 0.05;
    spawnParticle(p.x, p.y, 0, 0, 'rgba(148, 163, 184, 0.4)', 0.3, 2, 'back', 0);
  }
  
  if (p.target && !p.target.dead && !p.target.dying) {
    const d = dist(p.x, p.y, p.target.x, p.target.y - 20);
    if (d < 26) {
      applyDamage(p.target, p.damage, p.x, p.y, p.team, true);
      spawnHitSparks(p.target.x, p.target.y - 20, p.team);
      p.alive = false;
      return;
    }
  } else if (p.age > 1.0) {
    p.alive = false;
  }
  
  if (p.x < -80 || p.x > W + 80 || p.y < -80 || p.y > H + 80) p.alive = false;
}

function updateShadowbolt(p, dt) {
  if (p.target && !p.target.dead && !p.target.dying) {
    const dx = p.target.x - p.x;
    const dy = (p.target.y - 20) - p.y;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d < 20) {
      applyDamage(p.target, p.damage, p.x, p.y, p.team, false);
      spawnShadowImpact(p.target.x, p.target.y - 20);
      p.alive = false;
      return;
    }
    const step = p.speed * dt;
    if (d <= step) { p.x = p.target.x; p.y = p.target.y - 20; }
    else { p.x += (dx / d) * step; p.y += (dy / d) * step; }
  } else {
    p.x -= p.speed * dt;
    if (p.x < -50) p.alive = false;
  }
  p.trailT -= dt;
  if (p.trailT <= 0) {
    p.trailT = 0.04;
    spawnParticle(p.x, p.y, (Math.random() - 0.5) * 15, (Math.random() - 0.5) * 15, 'rgba(46, 204, 113, 0.6)', 0.3, 2, 'back', -10);
  }
}

function stickArrowInto(p, target) {
  p.alive = false;
  const offsetX = p.x - target.x, offsetY = p.y - target.y;
  if (!target.stuckArrows) target.stuckArrows = [];
  target.stuckArrows.push({ offsetX, offsetY, angle: p.rotation, age: 0, damage: p.damage, team: p.team, castle: p.castle });
  applyDamage(target, p.damage, p.x, p.y, p.team, false);
  spawnHitSparks(p.x, p.y, p.team);
}

function updateStreams(dt) {
  for (const s of G.streams) s.life -= dt;
  G.streams = G.streams.filter(s => s.life > 0 && s.target && !s.target.dead);
}

function explodeBomb(p) {
  spawnExplosion(p.x, p.y);
  const list = p.team === 'player' ? G.enemies : G.units;
  for (const t of list) {
    if (t.dead || t.dying) continue;
    const d = dist(p.x, p.y, t.x, t.y);
    if (d <= p.aoe) {
      const dmg = d < 22 ? p.damage : Math.round(p.damage * 0.6);
      applyDamage(t, dmg, p.x, p.y, p.team, true);
    }
  }
}

function applyDamage(target, damage, fromX, fromY, team, isHeavy) {
  if (target.dying || target.dead) return;
  target.hp -= damage;
  target.flashUntil = G.time + 0.1;
  const a = Math.atan2(target.y - fromY, target.x - fromX);
  const force = isHeavy ? 14 : 7;
  target.kbX = Math.cos(a) * force;
  target.kbY = Math.sin(a) * force;
  target.kbT = isHeavy ? 0.22 : 0.15;
  spawnHitSparks(target.x, target.y - 20, team);
  const yOff = (target.team === 'enemy' && ENEMY_TYPES[target.kind])
    ? 58 * ENEMY_TYPES[target.kind].scale + 20
    : 75;
  spawnDamageNumber(target.x, target.y, damage, false, yOff);
  if (target.hp <= 0) {
    target.dying = true;
    target.deathT = DEATH_DUR;
    if (target.team === 'player' && target.gridCell) G.grid[target.gridCell.r][target.gridCell.c] = null;
    spawnDeathBurst(target.x, target.y - 20);
    const dir = { x: Math.cos(a), y: Math.sin(a) };
    spawnDismemberment(target.x, target.y, target.kind, dir);
  }
}

function findNearest(from, list) {
  let best = null, bestD = Infinity;
  for (const t of list) {
    if (t.dead || t.dying) continue;
    const d = dist(from.x, from.y, t.x, t.y);
    if (d < bestD) { bestD = d; best = t; }
  }
  return best;
}

function dealDamage(attacker, target) {
  applyDamage(target, attacker.damage, attacker.x, attacker.y, attacker.team, false);
  G.effects.push({
    type: 'line', x1: attacker.x, y1: attacker.y, x2: target.x, y2: target.y,
    color: attacker.team === 'player' ? 'rgba(241, 196, 15, 0.85)' : 'rgba(231, 76, 60, 0.85)',
    life: 0.16, maxLife: 0.16
  });
}

function onWaveCleared() {
  if (G.phase !== 'battle') return;
  if (G.wave >= MAX_WAVES) { endGame(true); return; }
  G.gold += (G_DIFF ? G_DIFF.waveGold : 12) + (G.upgrades.goldBonus || 0);
  for (const u of G.units) {
    if (u.gridCell) {
      u.x = GRID_X + u.gridCell.c * CELL + CELL / 2;
      u.y = GRID_Y + u.gridCell.r * CELL + CELL / 2;
      u.moving = false;
      u.hp = u.maxHp;
      u.stuckArrows = [];
    }
  }
  G.projectiles = []; G.streams = [];
  G.offeredUpgrades = rollUpgradeChoices();
  G.phase = 'upgrade';
  G.infoText = 'Выберите улучшение!';
}

function endGame(win) {
  if (G.phase === 'over' || G.phase === 'defeat') return;
  G.phase = 'over';
  G.win = win;
  setTimeout(() => { G.scene = 'over'; }, 400);
}

function render(realDt) {
  let shakeX = 0, shakeY = 0;
  if (G.screenShake > 0) {
    G.screenShake = Math.max(0, G.screenShake - realDt * 2);
    const s = G.screenShake * 12;
    shakeX = (Math.random() - 0.5) * s;
    shakeY = (Math.random() - 0.5) * s;
  }
  if (G.phase === 'defeat') {
    const s = (G.defeatT / 2.5) * 15;
    shakeX += (Math.random() - 0.5) * s;
    shakeY += (Math.random() - 0.5) * s;
  }

  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (offsetX + shakeX * scale), dpr * (offsetY + shakeY * scale));
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#1a120b'; // Темное дерево
  ctx.fillRect(-20, -20, W + 40, H + 40);

  if (G.scene === 'menu') renderMenu();
  else if (G.scene === 'game') renderGame();
  else renderOver();

  if (G.phase === 'defeat') {
    const t = 1 - G.defeatT / 2.5;
    const intensity = Math.min(1, t * 1.5);
    const grad = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.75);
    grad.addColorStop(0, 'rgba(220,38,38,0)');
    grad.addColorStop(1, `rgba(220,38,38,${intensity * 0.6})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }
  if (G.castleHp < G.castleMaxHp * 0.5 && G.phase === 'battle') {
    const pulse = (Math.sin(G.time * 4) + 1) / 2;
    const grad = ctx.createRadialGradient(W/2, H/2, H*0.4, W/2, H/2, H*0.8);
    grad.addColorStop(0, 'rgba(220,38,38,0)');
    grad.addColorStop(1, `rgba(220,38,38,${(1 - G.castleHp/G.castleMaxHp) * pulse * 0.25})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }
}

/* ---- вспомогательные функции красивого меню ---- */
function hexToRgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}
function fitText(text, maxW, baseFont, minSize) {
  const m = baseFont.match(/^(\S+\s+)?(\d+)px\s(.*)$/);
  const prefix = m[1] || '', family = m[3];
  let size = parseInt(m[2], 10);
  ctx.font = baseFont;
  while (ctx.measureText(text).width > maxW && size > minSize) {
    size -= 1;
    ctx.font = prefix + size + 'px ' + family;
  }
  return size;
}
function drawWoodPanel(x, y, w, h, r) {
  // деревянная панель с теплым внутренним светом и двойной окантовкой
  const grad = ctx.createLinearGradient(x, y, x, y + h);
  grad.addColorStop(0, '#2e2013');
  grad.addColorStop(0.5, '#241812');
  grad.addColorStop(1, '#1c120c');
  roundRect(x, y, w, h, r); ctx.fillStyle = grad; ctx.fill();
  const glow = ctx.createRadialGradient(x + w / 2, y + h * 0.35, 10, x + w / 2, y + h * 0.35, Math.max(w, h) * 0.7);
  glow.addColorStop(0, 'rgba(241, 196, 15, 0.07)');
  glow.addColorStop(1, 'rgba(241, 196, 15, 0)');
  roundRect(x, y, w, h, r); ctx.fillStyle = glow; ctx.fill();
  ctx.strokeStyle = 'rgba(241, 196, 15, 0.55)'; ctx.lineWidth = 3;
  roundRect(x, y, w, h, r); ctx.stroke();
  ctx.strokeStyle = 'rgba(241, 196, 15, 0.16)'; ctx.lineWidth = 1.5;
  roundRect(x + 7, y + 7, w - 14, h - 14, Math.max(4, r - 6)); ctx.stroke();
}
function drawOrnament(cx, cy, color) {
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx - 90, cy); ctx.lineTo(cx - 16, cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 16, cy); ctx.lineTo(cx + 90, cy); ctx.stroke();
  ctx.translate(cx, cy); ctx.rotate(Math.PI / 4);
  ctx.fillStyle = color;
  roundRect(-7, -7, 14, 14, 3); ctx.fill();
  ctx.strokeStyle = 'rgba(26, 18, 11, 0.9)'; ctx.lineWidth = 2;
  roundRect(-7, -7, 14, 14, 3); ctx.stroke();
  ctx.restore();
}
function menuButtonBase(x, y, w, h, pressed, hovered) {
  const dy = pressed ? 3 : (hovered ? -2 : 0);
  return { x, y: y + dy, w, h };
}

function renderMenu() {
  const M = menuLayout();
  const p = M.panel;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // === общая деревянная панель — все элементы внутри, ничего не слипается ===
  drawWoodPanel(p.x, p.y, p.w, p.h, 26);

  // === заголовок с градиентом и тенью ===
  const titleY1 = p.y + (M.land ? 74 : 118);
  const lh = M.titleSize * 1.18;
  ctx.font = `bold ${M.titleSize}px system-ui, -apple-system, sans-serif`;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillText('СЛАВЯНСКИЕ', W/2 + 3, titleY1 + 3);
  ctx.fillText('КОРОНЫ', W/2 + 3, titleY1 + lh + 3);
  const tg = ctx.createLinearGradient(0, titleY1 - M.titleSize * 0.6, 0, titleY1 + lh + M.titleSize * 0.6);
  tg.addColorStop(0, '#ffe9a8');
  tg.addColorStop(0.5, '#f1c40f');
  tg.addColorStop(1, '#c9971b');
  ctx.fillStyle = tg;
  ctx.fillText('СЛАВЯНСКИЕ', W/2, titleY1);
  ctx.fillText('КОРОНЫ', W/2, titleY1 + lh);

  ctx.font = `${M.subtitleSize}px system-ui, -apple-system, sans-serif`;
  ctx.fillStyle = '#cbb894';
  ctx.fillText('Защити Детинец от нечисти', W/2, titleY1 + lh * 2 + 20);

  drawOrnament(W/2, titleY1 + lh * 2 + 50, 'rgba(241, 196, 15, 0.7)');

  // === витрина: боярин против беса ===
  const idleBob = Math.sin(G.time * 2.2) * 2;
  if (!M.land) {
    // портрет: оба на «земляном валу» по центру
    const fy = M.figuresY;
    const groundGrad = ctx.createLinearGradient(0, fy - 14, 0, fy + 26);
    groundGrad.addColorStop(0, '#4a3520');
    groundGrad.addColorStop(1, '#2a1c10');
    ctx.fillStyle = groundGrad;
    ctx.beginPath();
    ctx.ellipse(W/2, fy + 10, 265, 24, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(241, 196, 15, 0.22)'; ctx.lineWidth = 2;
    ctx.stroke();
    drawFigure('sword', M.figL.x, fy - 2 + idleBob, 1, G.time, false, 0, false, 0, 1, 0);
    drawFigure('goblin', M.figR.x, fy - 2 - idleBob, -1, G.time, false, 0, false, 0, 1, 0);
  } else {
    // ландшафт: по бокам панели, каждый на своём основании
    for (const f of [M.figL, M.figR]) {
      const groundGrad = ctx.createLinearGradient(0, f.y - 10, 0, f.y + 20);
      groundGrad.addColorStop(0, '#4a3520');
      groundGrad.addColorStop(1, '#2a1c10');
      ctx.fillStyle = groundGrad;
      ctx.beginPath();
      ctx.ellipse(f.x, f.y + 8, 88, 18, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(241, 196, 15, 0.22)'; ctx.lineWidth = 2;
      ctx.stroke();
    }
    drawFigure('sword', M.figL.x, M.figL.y - 2 + idleBob, 1, G.time, false, 0, false, 0, 1, 0);
    drawFigure('goblin', M.figR.x, M.figR.y - 2 - idleBob, -1, G.time, false, 0, false, 0, 1, 0);
  }

  // === выбор сложности: три карточки ===
  ctx.font = 'bold 24px system-ui, -apple-system, sans-serif';
  ctx.fillStyle = '#f1c40f';
  ctx.fillText('СЛОЖНОСТЬ', W/2, M.diffLabelY);

  for (const r of M.diffs) {
    const d = DIFFICULTIES[r.id];
    const sel = selectedDifficulty === r.id;
    const hovered = inRect(mouseX, mouseY, r.x, r.y, r.w, r.h);
    const pressed = menuBtnPressed === 'diff:' + r.id;
    const b = menuButtonBase(r.x, r.y, r.w, r.h, pressed, hovered);

    if (!pressed) {
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      roundRect(b.x + 2, b.y + 5, b.w, b.h, 16); ctx.fill();
    }
    const bg = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
    if (sel) {
      bg.addColorStop(0, hexToRgba(d.color, 0.95));
      bg.addColorStop(1, hexToRgba(d.color, 0.6));
    } else if (hovered) {
      bg.addColorStop(0, '#3b2c1a'); bg.addColorStop(1, '#2c2013');
    } else {
      bg.addColorStop(0, '#2a1d10'); bg.addColorStop(1, '#201509');
    }
    roundRect(b.x, b.y, b.w, b.h, 16); ctx.fillStyle = bg; ctx.fill();
    ctx.strokeStyle = sel ? d.stroke : 'rgba(160, 130, 90, 0.45)';
    ctx.lineWidth = sel ? 3.5 : 2;
    roundRect(b.x, b.y, b.w, b.h, 16); ctx.stroke();

    // верхняя цветовая полоска — уровень читается даже без текста
    ctx.save();
    roundRect(b.x, b.y, b.w, b.h, 16); ctx.clip();
    ctx.fillStyle = sel ? d.stroke : hexToRgba(d.color, 0.85);
    ctx.fillRect(b.x, b.y, b.w, 6);
    ctx.restore();

    // название уровня
    ctx.font = `bold ${Math.min(24, Math.floor(b.h * 0.2))}px system-ui, -apple-system, sans-serif`;
    ctx.fillStyle = sel ? '#ffffff' : '#e6d3ac';
    ctx.fillText(d.icon + ' ' + d.name.toUpperCase(), b.x + b.w / 2, b.y + b.h * 0.30);

    // тонкий разделитель
    ctx.strokeStyle = sel ? 'rgba(255,255,255,0.28)' : 'rgba(160,130,90,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(b.x + b.w * 0.18, b.y + b.h * 0.47);
    ctx.lineTo(b.x + b.w * 0.82, b.y + b.h * 0.47);
    ctx.stroke();

    // описание — при необходимости перенос по словам
    ctx.fillStyle = sel ? '#fdf3d8' : '#9b8a70';
    const descMaxW = b.w - 18;
    const descWords = d.desc.split(' ');
    let lines = [d.desc];
    ctx.font = '15px system-ui, -apple-system, sans-serif';
    if (ctx.measureText(d.desc).width > descMaxW && descWords.length > 1) {
      const mid = Math.ceil(descWords.length / 2);
      const l1 = descWords.slice(0, mid).join(' '), l2 = descWords.slice(mid).join(' ');
      lines = (ctx.measureText(l1).width <= descMaxW && ctx.measureText(l2).width <= descMaxW)
        ? [l1, l2]
        : [descWords[0], descWords.slice(1).join(' ')];
    }
    const longest = lines.reduce((a, c) => a.length >= c.length ? a : c, '');
    const descSize = fitText(longest, descMaxW, '15px system-ui, -apple-system, sans-serif', 10);
    ctx.font = `${descSize}px system-ui, -apple-system, sans-serif`;
    const lineH = descSize * 1.3;
    const descCenterY = b.y + b.h * (lines.length > 1 ? 0.73 : 0.71);
    lines.forEach((ln, i) => {
      ctx.fillText(ln, b.x + b.w / 2, descCenterY + (i - (lines.length - 1) / 2) * lineH);
    });

    // круглая галочка выбора
    if (sel) {
      const ccx = b.x + b.w - 18, ccy = b.y + 20, cr = 11;
      ctx.beginPath(); ctx.arc(ccx, ccy, cr, 0, Math.PI * 2);
      ctx.fillStyle = d.stroke; ctx.fill();
      ctx.strokeStyle = 'rgba(26,18,11,0.85)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(ccx - 5, ccy); ctx.lineTo(ccx - 1, ccy + 4.5); ctx.lineTo(ccx + 6, ccy - 4);
      ctx.stroke();
    }
  }

  // === большая кнопка «В БОЙ» с пульсирующим свечением ===
  {
    const pb = menuButtonBase(M.play.x, M.play.y, M.play.w, M.play.h,
      menuBtnPressed === 'play', inRect(mouseX, mouseY, M.play.x, M.play.y, M.play.w, M.play.h));
    const pulse = 0.5 + 0.5 * Math.sin(G.time * 2.4);
    ctx.save();
    ctx.shadowColor = 'rgba(241, 196, 15, ' + (0.3 + pulse * 0.3) + ')';
    ctx.shadowBlur = 20 + pulse * 10;
    const g = ctx.createLinearGradient(pb.x, pb.y, pb.x, pb.y + pb.h);
    g.addColorStop(0, '#8a2b1e'); g.addColorStop(0.5, '#6d1f14'); g.addColorStop(1, '#521510');
    roundRect(pb.x, pb.y, pb.w, pb.h, 18); ctx.fillStyle = g; ctx.fill();
    ctx.restore();
    ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 3.5;
    roundRect(pb.x, pb.y, pb.w, pb.h, 18); ctx.stroke();
    ctx.save();
    roundRect(pb.x, pb.y, pb.w, pb.h, 18); ctx.clip();
    const sh = ctx.createLinearGradient(pb.x, pb.y, pb.x, pb.y + pb.h * 0.45);
    sh.addColorStop(0, 'rgba(255,255,255,0.16)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sh; ctx.fillRect(pb.x, pb.y, pb.w, pb.h * 0.45);
    ctx.restore();
    const fs = Math.min(38, Math.floor(pb.h * 0.4));
    ctx.font = `bold ${fs}px system-ui, -apple-system, sans-serif`;
    ctx.fillStyle = '#ffe9a8';
    ctx.fillText('\u2694  В БОЙ  \u2694', pb.x + pb.w / 2, pb.y + pb.h / 2 - 1);
  }

  // === подпись снизу ===
  ctx.font = '19px system-ui, -apple-system, sans-serif';
  ctx.fillStyle = '#8f7f68';
  ctx.fillText('13 юнитов · поле 5×5 · 10 волн', W/2, M.footerY);
}

function renderGame() {
  ctx.fillStyle = 'rgba(44, 62, 80, 0.4)';
  roundRect(ARENA_X, ARENA_Y, ARENA_W, ARENA_H, 20);
  ctx.fill();
  ctx.strokeStyle = 'rgba(241, 196, 15, 0.3)';
  ctx.lineWidth = 1.5;
  roundRect(ARENA_X, ARENA_Y, ARENA_W, ARENA_H, 20);
  ctx.stroke();

  drawCastle();

  ctx.textAlign = 'left';
  ctx.font = 'bold 32px system-ui, -apple-system, sans-serif';
  ctx.fillStyle = '#f1c40f';
  ctx.fillText('💰 ' + G.gold, 40, LAYOUT.hudY);

  if (LAYOUT.mode === 'landscape') {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#e2e8f0';
    ctx.fillText('Волна ' + G.wave + '/' + MAX_WAVES, 400, LAYOUT.hudY);
    ctx.font = '22px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText(G.infoText, 400, LAYOUT.infoY);
    if (G_DIFF) {
      ctx.textAlign = 'left';
      ctx.font = 'bold 20px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = G_DIFF.stroke;
      ctx.fillText(G_DIFF.icon + ' ' + G_DIFF.name, 40, LAYOUT.hudY + 34);
    }
  } else {
    ctx.textAlign = 'right';
    ctx.fillStyle = '#e2e8f0';
    ctx.fillText('Волна ' + G.wave + '/' + MAX_WAVES, W - 30, LAYOUT.hudY);
    ctx.textAlign = 'center';
    ctx.font = '24px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText(G.infoText, W/2, LAYOUT.infoY);
    if (G_DIFF) {
      ctx.textAlign = 'left';
      ctx.font = 'bold 20px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = G_DIFF.stroke;
      ctx.fillText(G_DIFF.icon + ' ' + G_DIFF.name, 40, LAYOUT.hudY + 34);
    }
  }

  if (G.phase === 'prep') {
    const b = LAYOUT.btn;
    ctx.fillStyle = '#27ae60';
    roundRect(b.x, b.y, b.w, b.h, 12); ctx.fill();
    ctx.strokeStyle = '#2ecc71'; ctx.lineWidth = 4;
    roundRect(b.x, b.y, b.w, b.h, 12); ctx.stroke();
    ctx.textAlign = 'center';
    ctx.font = 'bold 36px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('В БОЙ', b.x + b.w / 2, b.y + b.h / 2);

    const rb = LAYOUT.rerollBtn;
    const rc = G_DIFF ? G_DIFF.rerollCost : REROLL_COST;
    const canReroll = G.gold >= rc;
    ctx.fillStyle = canReroll ? '#8e44ad' : '#374151';
    roundRect(rb.x, rb.y, rb.w, rb.h, 12); ctx.fill();
    ctx.strokeStyle = canReroll ? '#a78bfa' : '#6b7280'; ctx.lineWidth = 3;
    roundRect(rb.x, rb.y, rb.w, rb.h, 12); ctx.stroke();
    ctx.font = 'bold 22px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('🔄 ' + rc + '💰', rb.x + rb.w / 2, rb.y + rb.h / 2);
  }

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = GRID_X + c * CELL + 4;
      const y = GRID_Y + r * CELL + 4;
      const s = CELL - 8;
      
      let isHovered = false;
      let isValidTarget = false;
      if (G.phase === 'prep' && G.selectedIndex >= 0 && mouseX >= 0) {
        if (mouseX >= x && mouseX <= x + s && mouseY >= y && mouseY <= y + s) {
          isHovered = true;
          isValidTarget = !G.grid[r][c];
        }
      }
      
      if (isHovered && isValidTarget) {
        ctx.fillStyle = 'rgba(74, 222, 128, 0.25)';
        roundRect(x, y, s, s, 8); ctx.fill();
        ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 3;
        roundRect(x, y, s, s, 8); ctx.stroke();
        
        const card = G.hand[G.selectedIndex];
        if (card && card.range > 0) {
          const centerX = x + s / 2;
          const centerY = y + s / 2;
          ctx.globalAlpha = 0.2;
          ctx.fillStyle = card.color;
          ctx.beginPath();
          ctx.arc(centerX, centerY, card.range, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 0.5;
          ctx.strokeStyle = card.color;
          ctx.lineWidth = 2;
          ctx.setLineDash([8, 8]);
          ctx.beginPath();
          ctx.arc(centerX, centerY, card.range, 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.globalAlpha = 1;
        }
      } else if (isHovered && !isValidTarget) {
        ctx.fillStyle = 'rgba(239, 68, 68, 0.25)';
        roundRect(x, y, s, s, 8); ctx.fill();
        ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3;
        roundRect(x, y, s, s, 8); ctx.stroke();
      } else {
        ctx.fillStyle = 'rgba(44, 62, 80, 0.6)';
        roundRect(x, y, s, s, 8); ctx.fill();
        ctx.strokeStyle = 'rgba(241, 196, 15, 0.2)'; ctx.lineWidth = 1.5;
        roundRect(x, y, s, s, 8); ctx.stroke();
      }
    }
  }

  drawSplatters();

  for (const fx of G.effects) {
    if (fx.type === 'flash') {
      const a = fx.life / fx.maxLife;
      const r = fx.r * (1.4 - a * 0.6);
      const g = ctx.createRadialGradient(fx.x, fx.y, 0, fx.x, fx.y, r);
      if (fx.color === 'magic') {
        g.addColorStop(0, `rgba(255, 255, 255, ${a})`);
        g.addColorStop(0.4, `rgba(196, 181, 253, ${a * 0.8})`);
        g.addColorStop(1, 'rgba(142, 68, 173, 0)');
      } else {
        g.addColorStop(0, `rgba(254, 240, 138, ${a})`);
        g.addColorStop(0.45, `rgba(251, 146, 60, ${a * 0.7})`);
        g.addColorStop(1, 'rgba(220, 38, 38, 0)');
      }
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(fx.x, fx.y, r, 0, Math.PI * 2); ctx.fill();
    } else if (fx.type === 'heal_wave') {
      const a = fx.life / fx.maxLife;
      const r = 30 + (1 - a) * 30;
      ctx.globalAlpha = a;
      ctx.strokeStyle = '#1abc9c';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(fx.x, fx.y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(fx.x, fx.y, r - 4, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (fx.type === 'shockwave') {
      const a = fx.life / fx.maxLife;
      const r = fx.r * (1 - a) * 1.3;
      ctx.globalAlpha = a;
      ctx.strokeStyle = 'rgba(254, 240, 138, 0.9)';
      ctx.lineWidth = 3 * a + 1;
      ctx.beginPath(); ctx.arc(fx.x, fx.y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    } else {
      const a = fx.life / fx.maxLife;
      ctx.globalAlpha = a;
      ctx.strokeStyle = fx.color;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(fx.x1, fx.y1); ctx.lineTo(fx.x2, fx.y2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  drawParticles('back');
  for (const s of G.streams) drawMagicStream(s);
  for (const p of G.projectiles) {
    if (p.type === 'bomb') drawBombProjectile(p);
    else if (p.type === 'arrow') drawArrowProjectile(p);
    else if (p.type === 'shadowbolt') drawShadowboltProjectile(p);
    else if (p.type === 'bullet') drawBulletProjectile(p);
  }

  const drawList = [];
  for (const u of G.units) drawList.push({ isUnit: true, obj: u, y: u.y });
  for (const e of G.enemies) drawList.push({ isUnit: true, obj: e, y: e.y });
  for (const bp of G.bodyParts) drawList.push({ isUnit: false, obj: bp, y: bp.y });
  drawList.sort((a, b) => a.y - b.y);
  for (const item of drawList) {
    if (item.isUnit) drawCombatant(item.obj);
    else drawBodyPart(item.obj);
  }

  drawParticles('front');
  drawFloatingTexts();
  drawHandCards();
  drawUpgradeIndicators();
  if (G.phase === 'upgrade') renderUpgradeScreen();

  if (G.phase === 'defeat') {
    const t = 1 - G.defeatT / 2.5;
    ctx.fillStyle = `rgba(10, 0, 0, ${t * 0.6})`;
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    const scl = 1 + t * 0.3;
    ctx.save();
    ctx.translate(W/2, H/2 - 100);
    ctx.scale(scl, scl);
    ctx.font = 'bold 92px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = `rgba(192, 57, 43, ${t})`;
    ctx.fillText('ДЕТИНЕЦ', 0, 0);
    ctx.fillText('ПАЛ', 0, 100);
    ctx.restore();
    if (t > 0.5) {
      ctx.font = 'bold 32px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = `rgba(203, 213, 225, ${(t - 0.5) * 2})`;
      ctx.fillText('Волна ' + G.wave + ' из ' + MAX_WAVES, W/2, H/2 + 60);
    }
  }
}

function drawUpgradeIndicators() {
  const entries = Object.entries(G.upgradeCount);
  if (entries.length === 0) return;
  ctx.textAlign = 'left';
  let x = 40, y = LAYOUT.hudY + 35;
  for (const [id, count] of entries) {
    const card = UPGRADE_CARDS.find(c => c.id === id);
    if (!card) continue;
    ctx.font = '18px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText(card.icon + '×' + count, x, y);
    x += 50;
    if (x > W - 100) { x = 40; y += 22; }
  }
}

function renderUpgradeScreen() {
  ctx.fillStyle = 'rgba(26, 18, 11, 0.92)'; // Темное дерево
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 52px system-ui, -apple-system, sans-serif';
  ctx.fillStyle = '#f1c40f';
  ctx.fillText('УЛУЧШЕНИЕ', W/2, 80);
  ctx.font = '24px system-ui, -apple-system, sans-serif';
  ctx.fillStyle = '#d5d8dc';
  ctx.fillText('Волна ' + G.wave + ' отбита! Выберите карту', W/2, 130);

  G.upgradeCardRects = [];
  const isLand = LAYOUT.mode === 'landscape';

  const colorByKind = { sword:'#c0392b', archer:'#27ae60', mage:'#8e44ad', wall:'#8e5a3b', bomb:'#d35400', spearman:'#f39c12', assassin:'#2c3e50', healer:'#1abc9c', fanatic:'#641e16', shepherd:'#f1c40f', strelets:'#e74c3c', tower:'#7f8c8d', mortar:'#95a5a6', all:'#facc15', gold:'#fbbf24', castle:'#fde047' };
  const kindLabel = { all:'ВСЕ ЮНИТЫ', gold:'ЭКОНОМИКА', sword:'БОЯРИН', archer:'ЛУЧНИК', mage:'ВОЛХВ', wall:'ОСТРОГ', bomb:'ЗЕЛЕЙЩИК', spearman:'ОПОЛЧЕНЕЦ', assassin:'РАЗБОЙНИК', healer:'ЛЕКАРЬ', fanatic:'СТАРООБРЯДЕЦ', shepherd:'БАТЮШКА', strelets:'СТРЕЛЕЦ', tower:'СРУБ', mortar:'ПУШКА', castle:'ДЕТИНЕЦ' };

  if (isLand) {
    const cardW = 380;
    const cardH = 450;
    const gap = 30;
    const startX = (W - (cardW * 3 + gap * 2)) / 2;
    const startY = 180;

    for (let i = 0; i < G.offeredUpgrades.length; i++) {
      const card = G.offeredUpgrades[i];
      const cx = startX + i * (cardW + gap);
      const cy = startY;
      G.upgradeCardRects.push({ x: cx, y: cy, w: cardW, h: cardH, idx: i });

      const bgGrad = ctx.createLinearGradient(cx, cy, cx, cy + cardH);
      bgGrad.addColorStop(0, '#2c3e50'); bgGrad.addColorStop(1, '#1a252f');
      ctx.fillStyle = bgGrad;
      roundRect(cx, cy, cardW, cardH, 18); ctx.fill();

      ctx.strokeStyle = colorByKind[card.kind] || '#f1c40f';
      ctx.lineWidth = 4;
      roundRect(cx, cy, cardW, cardH, 18); ctx.stroke();

      ctx.font = '100px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(card.icon, cx + cardW/2, cy + 120);

      ctx.font = 'bold 32px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(card.name, cx + cardW/2, cy + 210);

      ctx.font = '22px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = '#d5d8dc';
      ctx.fillText(card.desc, cx + cardW/2, cy + 260);

      ctx.font = '18px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = colorByKind[card.kind] || '#f1c40f';
      ctx.fillText('▸ ' + (kindLabel[card.kind] || 'ОБЩЕЕ'), cx + cardW/2, cy + 310);

      const cnt = G.upgradeCount[card.id] || 0;
      if (cnt > 0) {
        ctx.font = '18px system-ui, -apple-system, sans-serif';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('взято ×' + cnt, cx + cardW/2, cy + 360);
      }
    }
  } else {
    const cardW = Math.min(600, W - 60);
    const cardH = 200;
    const startX = (W - cardW) / 2;
    const startY = 200;
    const cardGap = 25;

    for (let i = 0; i < G.offeredUpgrades.length; i++) {
      const card = G.offeredUpgrades[i];
      const cx = startX, cy = startY + i * (cardH + cardGap);
      G.upgradeCardRects.push({ x: cx, y: cy, w: cardW, h: cardH, idx: i });
      const bgGrad = ctx.createLinearGradient(cx, cy, cx, cy + cardH);
      bgGrad.addColorStop(0, '#2c3e50'); bgGrad.addColorStop(1, '#1a252f');
      ctx.fillStyle = bgGrad;
      roundRect(cx, cy, cardW, cardH, 18); ctx.fill();
      ctx.strokeStyle = colorByKind[card.kind] || '#f1c40f';
      ctx.lineWidth = 4;
      roundRect(cx, cy, cardW, cardH, 18); ctx.stroke();
      ctx.font = '80px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(card.icon, cx + 80, cy + cardH / 2 + 10);
      ctx.textAlign = 'left';
      ctx.font = 'bold 30px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(card.name, cx + 155, cy + 60);
      ctx.font = '22px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = '#d5d8dc';
      ctx.fillText(card.desc, cx + 155, cy + 105);
      ctx.font = '18px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = colorByKind[card.kind] || '#f1c40f';
      ctx.fillText('▸ ' + (kindLabel[card.kind] || 'ОБЩЕЕ'), cx + 155, cy + 145);
      const cnt = G.upgradeCount[card.id] || 0;
      if (cnt > 0) {
        ctx.textAlign = 'right';
        ctx.font = '20px system-ui, -apple-system, sans-serif';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('взято ×' + cnt, cx + cardW - 25, cy + 40);
      }
    }
  }
  ctx.textAlign = 'center';
  ctx.font = '20px system-ui, -apple-system, sans-serif';
  ctx.fillStyle = '#d5d8dc';
  ctx.fillText('Тапни карту, чтобы применить', W/2, H - 40);
}

function drawCombatant(u) {
  if (u.dead || u.dying) return;

  if (u.kind === 'shepherd' && u.team === 'player') {
    const auraR = u.auraRange || SHEPHERD_AURA_RANGE;
    const pulse = 0.28 + Math.sin(G.time * 2.2) * 0.12;
    ctx.strokeStyle = `rgba(241, 196, 15, ${pulse})`;
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 8]);
    ctx.beginPath();
    ctx.arc(u.x, u.y, auraR, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    const ag = ctx.createRadialGradient(u.x, u.y, 0, u.x, u.y, auraR);
    ag.addColorStop(0, `rgba(241, 196, 15, ${pulse * 0.18})`);
    ag.addColorStop(1, 'rgba(241, 196, 15, 0)');
    ctx.fillStyle = ag;
    ctx.beginPath(); ctx.arc(u.x, u.y, auraR, 0, Math.PI * 2); ctx.fill();
  }

  if (u.kind === 'fanatic' && u.team === 'player') {
    const hasShepherd = G.units.some(a => a.kind === 'shepherd' && !a.dead && !a.dying);
    if (hasShepherd) {
      const pulse = 0.4 + Math.sin(G.time * 5) * 0.25;
      const fg = ctx.createRadialGradient(u.x, u.y - 20, 0, u.x, u.y - 20, 38);
      fg.addColorStop(0, `rgba(192, 57, 43, ${pulse * 0.4})`);
      fg.addColorStop(1, 'rgba(192, 57, 43, 0)');
      ctx.fillStyle = fg;
      ctx.beginPath(); ctx.arc(u.x, u.y - 20, 38, 0, Math.PI * 2); ctx.fill();
    }
  }

  const flash = G.time < u.flashUntil;
  const facing = u.team === 'enemy' ? -1 : 1;
  const atkP = u.attackT > 0 ? 1 - u.attackT / ATK_DUR : 0;
  const spawnP = u.spawnT > 0 ? 1 - u.spawnT / SPAWN_DUR : 1;
  const kbR = u.kbT > 0 ? u.kbT / 0.15 : 0;
  const drawX = u.x + u.kbX * kbR;
  const drawY = u.y + u.kbY * kbR;
  if (u.stuckArrows && u.stuckArrows.length > 0) {
    for (const sa of u.stuckArrows) drawStuckArrowBehind(u, sa, drawX, drawY);
  }
  drawFigure(u.kind, drawX, drawY + 35, facing, G.time + u.x * 0.01, flash, u.walkPhase, u.moving, atkP, spawnP, 0);
  if (u.stuckArrows && u.stuckArrows.length > 0) {
    for (const sa of u.stuckArrows) drawStuckArrowFront(u, sa, drawX, drawY);
  }

  if (u.healGlowUntil > G.time) {
    const a = (u.healGlowUntil - G.time) / 0.6;
    ctx.globalAlpha = a;
    const hg = ctx.createRadialGradient(u.x, u.y - 20, 0, u.x, u.y - 20, 45);
    hg.addColorStop(0, 'rgba(26, 188, 156, 0.6)');
    hg.addColorStop(1, 'rgba(26, 188, 156, 0)');
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(u.x, u.y - 20, 45, 0, Math.PI * 2); ctx.fill();
    
    if (Math.random() < 0.4) {
      spawnParticle(u.x + (Math.random()-0.5)*30, u.y + 10, 0, -40, '#1abc9c', 0.6, 3, 'front', 0);
    }
    ctx.globalAlpha = 1;
  }

  if (u.buffGlowUntil > G.time) {
    const a = (u.buffGlowUntil - G.time) / 0.1;
    ctx.globalAlpha = Math.min(1, a);
    const fg = ctx.createRadialGradient(u.x, u.y - 20, 0, u.x, u.y - 20, 35);
    fg.addColorStop(0, 'rgba(241, 196, 15, 0.25)');
    fg.addColorStop(1, 'rgba(241, 196, 15, 0)');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(u.x, u.y - 20, 35, 0, Math.PI * 2); ctx.fill();
    
    const cx = u.x + Math.sin(G.time * 3 + u.x) * 8;
    const cy = u.y - 85 + Math.cos(G.time * 2 + u.x) * 5;
    ctx.fillStyle = '#f1c40f';
    ctx.fillRect(cx - 1.5, cy - 6, 3, 12);
    ctx.fillRect(cx - 6, cy - 1.5, 12, 3);
    ctx.globalAlpha = 1;
  }

  if (spawnP >= 1) {
    const unitScale = (u.team === 'enemy' && ENEMY_TYPES[u.kind]) ? ENEMY_TYPES[u.kind].scale : 1;
    const w = 48 * Math.max(1, unitScale * 0.85);
    const h = 7;
    const bx = u.x - w / 2;
    const by = u.y - 58 * unitScale;
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    roundRect(bx, by, w, h, 3); ctx.fill();
    const pct = Math.max(0, Math.min(1, u.hp / u.maxHp));
    if (pct > 0) {
      ctx.fillStyle = pct > 0.5 ? '#27ae60' : pct > 0.25 ? '#f39c12' : '#c0392b';
      roundRect(bx, by, w * pct, h, 3); ctx.fill();
    }
    if (u.team === 'enemy' && u.kind !== 'goblin' && ENEMY_TYPES[u.kind]) {
      const fontSize = Math.round(11 * Math.max(1, unitScale * 0.95));
      ctx.font = `bold ${fontSize}px system-ui, -apple-system, sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillStyle = ENEMY_TYPES[u.kind].skin;
      ctx.strokeStyle = 'rgba(0,0,0,0.7)';
      ctx.lineWidth = 2.5;
      ctx.strokeText(ENEMY_TYPES[u.kind].name, u.x, by - 8);
      ctx.fillText(ENEMY_TYPES[u.kind].name, u.x, by - 8);
    }
  }
}

function drawHandCards() {
  for (let i = 0; i < G.hand.length; i++) {
    const card = G.hand[i];
    const r = getCardRect(i);
    const selected = i === G.selectedIndex;
    const lift = selected ? -10 : 0;
    const cx = r.x, cy = r.y + lift, cw = r.w, ch = r.h;

    ctx.save();
    if (selected) {
      const ccx = cx + cw / 2, ccy = cy + ch / 2;
      ctx.translate(ccx, ccy); ctx.scale(1.05, 1.05); ctx.translate(-ccx, -ccy);
    }
    
    // Темное дерево для фона карты
    ctx.fillStyle = '#2c3e50';
    roundRect(cx, cy, cw, ch, 14); ctx.fill();
    ctx.strokeStyle = card.color; ctx.lineWidth = 4;
    roundRect(cx, cy, cw, ch, 14); ctx.stroke();

    if (LAYOUT.mode === 'portrait') {
      drawFigure(card.id, cx + cw / 2, cy + 148, 1, G.time, false, 0, false, 0, 1, 0);
      
      ctx.textAlign = 'center';
      ctx.font = 'bold 22px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(card.name, cx + cw / 2, cy + 32);

      const ups = G.kindUpgrades[card.id];
      const hpMul = G.upgrades.hpMul || 0;
      let bonusDmg = ups ? ups.damage : 0;
      let bonusHp = (ups ? ups.hp : 0) + Math.round(card.hp * hpMul);
      let bonusRange = ups ? ups.range : 0;

      ctx.font = '18px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = '#d5d8dc';
      
      const sx = cx + cw / 2, sy = cy + 165; 
      const dmgText = card.damage + (bonusDmg > 0 ? '(+' + bonusDmg + ')' : '');
      const hpText = card.hp + (bonusHp > 0 ? '(+' + bonusHp + ')' : '');
      const rangeText = card.range + (bonusRange > 0 ? '(+' + bonusRange + ')' : '');
      
      ctx.fillText('❤ ' + hpText, sx - 45, sy);
      if (card.healer) {
        const healAmt = (card.heal || 0) + (ups ? ups.heal : 0);
        ctx.fillStyle = '#1abc9c';
        ctx.fillText('✚ ' + healAmt, sx + 45, sy);
      } else {
        ctx.fillText('⚔ ' + dmgText, sx + 45, sy);
      }
      if (card.id === 'archer') {
        const acc = Math.round(Math.min(1, BASE_ARCHER_ACCURACY + (ups ? ups.accuracy : 0)) * 100);
        ctx.fillStyle = acc >= 100 ? '#27ae60' : '#f39c12';
        ctx.fillText('🎯 ' + acc + '%', sx, sy + 26);
      } else {
        ctx.fillStyle = '#aab7b8';
        ctx.fillText('◎ ' + rangeText, sx, sy + 26);
      }
      ctx.font = 'bold 26px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = '#f1c40f';
      ctx.fillText(card.cost + ' 💰', cx + cw / 2, cy + ch - 24); 
    } else {
      ctx.save();
      ctx.translate(cx + 80, cy + ch - 20);
      ctx.scale(0.7, 0.7);
      drawFigure(card.id, 0, 0, 1, G.time, false, 0, false, 0, 1, 0);
      ctx.restore();

      ctx.textAlign = 'left';
      ctx.font = 'bold 28px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(card.name, cx + 160, cy + 40);

      const ups = G.kindUpgrades[card.id];
      const hpMul = G.upgrades.hpMul || 0;
      let bonusDmg = ups ? ups.damage : 0;
      let bonusHp = (ups ? ups.hp : 0) + Math.round(card.hp * hpMul);

      ctx.font = '22px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = '#d5d8dc';
      const hpText = card.hp + (bonusHp > 0 ? '(+' + bonusHp + ')' : '');
      const dmgText = card.damage + (bonusDmg > 0 ? '(+' + bonusDmg + ')' : '');
      ctx.fillText('❤ ' + hpText, cx + 160, cy + 90);
      if (card.healer) {
        const healAmt = (card.heal || 0) + (ups ? ups.heal : 0);
        ctx.fillStyle = '#1abc9c';
        ctx.fillText('✚ ' + healAmt, cx + 320, cy + 90);
      } else {
        ctx.fillText('⚔ ' + dmgText, cx + 320, cy + 90);
      }

      ctx.fillStyle = '#aab7b8';
      if (card.id === 'archer') {
        const acc = Math.round(Math.min(1, BASE_ARCHER_ACCURACY + (ups ? ups.accuracy : 0)) * 100);
        ctx.fillStyle = acc >= 100 ? '#27ae60' : '#f39c12';
        ctx.fillText('🎯 ' + acc + '%', cx + 160, cy + 135);
      } else if (card.id === 'shepherd') {
        const aura = SHEPHERD_BASE_AURA + (ups ? ups.auraDmg : 0);
        ctx.fillStyle = '#f1c40f';
        ctx.fillText('🌟 +' + aura + ' урона в ауре', cx + 160, cy + 135);
      } else {
        ctx.fillText('◎ ' + (card.range + (ups ? ups.range : 0)), cx + 160, cy + 135);
      }

      ctx.textAlign = 'right';
      ctx.font = 'bold 34px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = '#f1c40f';
      ctx.fillText(card.cost + ' 💰', cx + cw - 20, cy + ch - 30);
    }
    ctx.restore();
  }
}

function renderOver() {
  ctx.textAlign = 'center';
  ctx.font = 'bold 96px system-ui, -apple-system, sans-serif';
  ctx.fillStyle = G.win ? '#27ae60' : '#c0392b';
  ctx.fillText(G.win ? 'ПОБЕДА!' : 'ПОРАЖЕНИЕ', W/2, H/2 - 260);
  ctx.font = '32px system-ui, -apple-system, sans-serif';
  ctx.fillStyle = '#d5d8dc';
  if (G.win) {
    ctx.fillText('Все ' + MAX_WAVES + ' волн отбиты!', W/2, H/2 - 170);
  } else {
    ctx.fillText('Детинец пал на волне ' + G.wave, W/2, H/2 - 170);
    ctx.font = '24px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = '#aab7b8';
    ctx.fillText('Нечисть прорвалась через защиту', W/2, H/2 - 125);
  }
  if (G_DIFF) {
    ctx.font = '26px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = G_DIFF.stroke;
    ctx.fillText('Сложность: ' + G_DIFF.icon + ' ' + G_DIFF.name, W/2, H/2 - 85);
  }
  if (G.win) drawFigure('sword', W/2, H/2 + 20, 1, G.time, false, 0, false, 0, 1, 0);
  else drawFigure('goblin', W/2, H/2 + 20, 1, G.time, false, 0, false, 0, 1, 0);

  const ob = overBtnRect();
  const g = ctx.createLinearGradient(ob.x, ob.y, ob.x, ob.y + ob.h);
  g.addColorStop(0, '#3d566e'); g.addColorStop(1, '#22303f');
  roundRect(ob.x, ob.y, ob.w, ob.h, 16); ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 3.5;
  roundRect(ob.x, ob.y, ob.w, ob.h, 16); ctx.stroke();
  ctx.font = `bold ${Math.min(40, Math.floor(ob.h * 0.45))}px system-ui, -apple-system, sans-serif`;
  ctx.fillStyle = '#ffe9a8';
  ctx.fillText('ЗАНОВО', W/2, ob.y + ob.h/2);

  const entries = Object.entries(G.upgradeCount);
  if (entries.length > 0) {
    ctx.font = '22px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = '#aab7b8';
    ctx.fillText('Взято карт: ' + entries.reduce((s, [, c]) => s + c, 0), W/2, by + bh + 50);
  }
}

resize();
requestAnimationFrame(loop);

})();
</script>
</body>
