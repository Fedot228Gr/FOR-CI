let W, H, LAYOUT;
let GRID_X, GRID_Y, CELL;
let CASTLE_X, CASTLE_W, CASTLE_TOP, CASTLE_BOTTOM, CASTLE_CX, CASTLE_CY;
let ARENA_X, ARENA_Y, ARENA_W, ARENA_H;

function computeLayout() {
  const cw = window.innerWidth;
  const ch = window.innerHeight;
  const isLandscape = cw > ch * 1.15;

  if (isLandscape) {
    W = 1440; H = 810;
    CELL = 88;
    GRID_X = 180;
    GRID_Y = 150;
    CASTLE_X = 80;
    CASTLE_W = 100;
    CASTLE_TOP = GRID_Y;
    CASTLE_BOTTOM = GRID_Y + 5 * CELL;
    ARENA_X = 20;
    ARENA_Y = 120;
    ARENA_W = GRID_X + 5 * CELL - ARENA_X + 20;
    ARENA_H = CASTLE_BOTTOM - ARENA_Y + 20;
    LAYOUT = {
      mode: 'landscape',
      btn: { x: 1160, y: 30, w: 250, h: 60 },
      rerollBtn: { x: 1160, y: 100, w: 250, h: 60 },
      cardX: 690, cardY: 110, cardW: 720, cardH: 200, cardGap: 20,
      hudY: 50, infoY: 100
    };
  } else {
    W = 720; H = 1280;
    GRID_X = 130; GRID_Y = 300; CELL = 105;
    CASTLE_X = 80; CASTLE_W = 90; CASTLE_TOP = 387; CASTLE_BOTTOM = 737;
    ARENA_X = 15; ARENA_Y = 270; ARENA_W = 690; ARENA_H = 590;
    LAYOUT = {
      mode: 'portrait',
      btn: { x: W/2 - 230, y: 170, w: 280, h: 80 },
      rerollBtn: { x: W/2 + 70, y: 170, w: 160, h: 80 },
      cardX: 0, cardY: 950, cardW: 200, cardH: 260, cardGap: 20,
      hudY: 50, infoY: 110
    };
  }
  CASTLE_CX = CASTLE_X;
  CASTLE_CY = (CASTLE_TOP + CASTLE_BOTTOM) / 2;
}

function getCardRect(i) {
  const L = LAYOUT;
  if (L.mode === 'landscape') {
    return { x: L.cardX, y: L.cardY + i * (L.cardH + L.cardGap), w: L.cardW, h: L.cardH };
  } else {
    const totalW = 3 * L.cardW + 2 * L.cardGap;
    const startX = (W - totalW) / 2;
    return { x: startX + i * (L.cardW + L.cardGap), y: L.cardY, w: L.cardW, h: L.cardH };
  }
}

const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
let scale = 1, offsetX = 0, offsetY = 0, dpr = 1;
let mouseX = -1, mouseY = -1;

function resize() {
  computeLayout();
  dpr = window.devicePixelRatio || 1;
  const cw = window.innerWidth;
  const ch = window.innerHeight;
  canvas.width = Math.max(1, Math.floor(cw * dpr));
  canvas.height = Math.max(1, Math.floor(ch * dpr));
  scale = Math.min(cw / W, ch / H);
  offsetX = (cw - W * scale) / 2;
  offsetY = (ch - H * scale) / 2;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offsetX, dpr * offsetY);
  ctx.textBaseline = 'middle';
  if (typeof G !== 'undefined' && G && G.units && G.phase === 'prep') {
    for (const u of G.units) {
      if (u.gridCell) {
        u.x = GRID_X + u.gridCell.c * CELL + CELL / 2;
        u.y = GRID_Y + u.gridCell.r * CELL + CELL / 2;
      }
    }
  }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 150));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

function toLogical(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return { x: (clientX - rect.left - offsetX) / scale, y: (clientY - rect.top - offsetY) / scale };
}

canvas.addEventListener('pointermove', (e) => {
  const p = toLogical(e.clientX, e.clientY);
  mouseX = p.x;
  mouseY = p.y;
}, { passive: true });

canvas.addEventListener('pointerleave', () => {
  mouseX = -1;
  mouseY = -1;
}, { passive: true });

/* =========================================================
   РАСКЛАДКА ГЛАВНОГО МЕНЮ — адаптивная, без «слипания»
   Панели и кнопки строятся от размеров экрана (W×H):
   портрет 720×1280 · ландшафт 1440×810
   ========================================================= */
const MENU_PANEL_PAD = 40;
const MENU_GAP = 26;

function menuPanelRect() {
  if (W > H) {
    // Ландшафт: панель занимает ~52% ширины по центру
    const pw = Math.min(780, W * 0.54);
    const ph = H - 48;
    return { x: W / 2 - pw / 2, y: 24, w: pw, h: ph };
  }
  // Портрет: высокая колонна
  const pw = Math.min(640, W - 40);
  return { x: W / 2 - pw / 2, y: 36, w: pw, h: H - 72 };
}

function menuLayout() {
  const p = menuPanelRect();
  const innerW = p.w - MENU_PANEL_PAD * 2;
  const land = W > H;

  // Кнопки сложности
  const dgap = land ? 18 : 16;
  let dw = Math.floor((innerW - dgap * 2) / 3);
  let dh = land ? 108 : 124;
  // Если описания не помещаются по ширине — увеличиваем высоту кнопок
  ctx.font = '15px system-ui, -apple-system, sans-serif';
  const maxDescW = dw - 20;
  const needTall = ['easy', 'normal', 'hard'].some(id =>
    ctx.measureText(DIFFICULTIES[id].desc).width > maxDescW);
  if (needTall && !land) dh = 150;
  else if (needTall && land) dh = 122;
  const drowW = dw * 3 + dgap * 2;
  const dx0 = p.x + p.w / 2 - drowW / 2;

  // Кнопка «В БОЙ»
  const playH = land ? 84 : 100;
  const playW = land ? Math.min(420, innerW) : Math.min(innerW, 460);

  let diffLabelY, diffY, playY, titleSize, subtitleSize, figuresY, footerY;
  if (land) {
    titleSize = 46; subtitleSize = 19;
    const titleY1 = p.y + 62;
    const ornamentY = titleY1 + titleSize * 1.18 * 2 + 46;
    diffLabelY = ornamentY + 34;
    diffY = diffLabelY + 22;
    playY = diffY + dh + 26;
    // в ландшафте фигуры стоят по бокам панели (не пересекаются с кнопками)
    figuresY = p.y + p.h * 0.62;
    footerY = p.y + p.h - 24;
  } else {
    titleSize = 64; subtitleSize = 24;
    const titleY1 = p.y + 118;
    figuresY = titleY1 + 300;
    diffLabelY = figuresY + 104;
    diffY = diffLabelY + 30;
    playY = diffY + dh + MENU_GAP + 10;
    footerY = playY + playH + 52;
  }

  const diffs = ['easy', 'normal', 'hard'].map((id, i) => ({
    id, x: dx0 + i * (dw + dgap), y: diffY, w: dw, h: dh
  }));
  const play = { x: p.x + p.w / 2 - playW / 2, y: playY, w: playW, h: playH };
  let figL, figR;
  if (land) {
    figL = { x: p.x + 92, y: figuresY };
    figR = { x: p.x + p.w - 92, y: figuresY };
  } else {
    figL = { x: W / 2 - 130, y: figuresY };
    figR = { x: W / 2 + 130, y: figuresY };
  }
  return { panel: p, diffs, play, titleSize, subtitleSize, figuresY, diffLabelY, footerY, land, figL, figR };
}

function diffBtnRects() { return menuLayout().diffs; }

function overBtnRect() {
  // кнопка «ЗАНОВО» на экране итогов — адаптивная
  const bw = W > H ? 360 : Math.min(420, W - 80);

  return { x: W / 2 - bw / 2, y: H / 2 + (W > H ? 110 : 150), w: bw, h: bh };

function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function dist(ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; return Math.sqrt(dx*dx + dy*dy); }
function rndInt(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); }
function choice(a) { return a[Math.floor(Math.random() * a.length)]; }
function inRect(px, py, x, y, w, h) { return px >= x && px <= x + w && py >= y && py <= y + h; }
function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}
function attackRotate(p) {
  if (p <= 0) return 0;
  if (p < 0.25) return -(p / 0.25) * 0.5;
  if (p < 0.55) return -0.5 + ((p - 0.25) / 0.3) * 2.3;
  return 1.8 * (1 - (p - 0.55) / 0.45);
}

function updateFloatingTexts(dt) {
  for (const ft of G.floatingTexts) {
    ft.life -= dt;
    ft.y += ft.vy * dt;
    ft.vy *= 0.95;
    ft.scale *= 0.98;
  }
  G.floatingTexts = G.floatingTexts.filter(ft => ft.life > 0);
}

function drawFloatingTexts() {
  for (const ft of G.floatingTexts) {
    const alpha = Math.min(1, ft.life / (ft.maxLife * 0.3));
    ctx.globalAlpha = alpha;
    ctx.font = `bold ${Math.round(24 * ft.scale)}px system-ui, -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillText(ft.text, ft.x + 2, ft.y + 2);
    ctx.fillStyle = ft.color;
    ctx.fillText(ft.text, ft.x, ft.y);
  }
  ctx.globalAlpha = 1;
}

function spawnDismemberment(x, y, kind, dir) {
  const cfg = PART_CONFIGS[kind] || PART_CONFIGS.goblin;
  if (!cfg) return;
  const isBrick = !!cfg.brick;

  if (!isBrick) {
    for (let i = 0; i < 20; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 100 + Math.random() * 220;
      spawnParticle(x + (Math.random()-0.5)*12, y - 30 + (Math.random()-0.5)*20, Math.cos(a)*sp, Math.sin(a)*sp - 100, Math.random() < 0.5 ? '#dc2626' : '#b91c1c', 0.7 + Math.random() * 0.5, 2 + Math.random() * 3.5, 'front', 500);
    }
    for (let i = 0; i < 6; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 120 + Math.random() * 180;
      spawnParticle(x, y - 30, Math.cos(a)*sp, Math.sin(a)*sp - 100, '#fef3c7', 0.25, 2, 'front', 400);
    }
    for (let i = 0; i < 8; i++) {
      G.splatters.push({ x: x + (Math.random()-0.5)*80, y: y + (Math.random()-0.5)*30, r: 4 + Math.random() * 9, color: Math.random() < 0.5 ? '#991b1b' : '#7f1d1d', life: 3.5 + Math.random() * 2, maxLife: 3.5 + Math.random() * 2 });
    }
  } else {
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 60 + Math.random() * 160;
      spawnParticle(x, y - 30, Math.cos(a)*sp, Math.sin(a)*sp - 80, 'rgba(139, 101, 8, 0.75)', 0.7, 3 + Math.random() * 3, 'front', 400);
    }
  }

  const parts = [];
  if (cfg.head)   parts.push({ type:'head',  cfg: cfg.head });
  if (cfg.torso)  parts.push({ type:'torso', cfg: cfg.torso });
  if (cfg.arm)  { parts.push({ type:'arm',   cfg: cfg.arm }); parts.push({ type:'arm', cfg: cfg.arm }); }
  if (cfg.leg)  { parts.push({ type:'leg',   cfg: cfg.leg }); parts.push({ type:'leg', cfg: cfg.leg }); }
  if (cfg.brick) { for (let i = 0; i < 8; i++) parts.push({ type:'brick', cfg: cfg.brick }); }

  const feetY = y + 35;

  for (const p of parts) {
    const boost = p.type === 'head' ? 1.4 : p.type === 'torso' ? 0.7 : 1;
    const spreadA = Math.random() * Math.PI * 2;
    const spreadSpeed = (60 + Math.random() * 140) * boost;
    G.bodyParts.push({
      x: x + (Math.random()-0.5)*16, y: feetY - 40 + (Math.random()-0.5)*20,
      vx: Math.cos(spreadA) * spreadSpeed + dir.x * (60 + Math.random()*100),
      vy: Math.sin(spreadA) * spreadSpeed - 220 - Math.random()*180,
      gravity: 700, rotation: Math.random() * Math.PI * 2, rotSpeed: (Math.random()-0.5) * 16,
      part: p.cfg, partType: p.type,
      life: 3.5 + Math.random() * 1.5, maxLife: 5,
      groundY: feetY + (Math.random()-0.5)*15,
      bounces: 0, landed: false, bloodied: !isBrick
    });
  }
}

function updateBodyParts(dt) {
  for (const bp of G.bodyParts) {
    bp.life -= dt;
    if (bp.life <= 0) continue;
    if (!bp.landed) {
      bp.vy += bp.gravity * dt;
      bp.x += bp.vx * dt;
      bp.y += bp.vy * dt;
      bp.rotation += bp.rotSpeed * dt;
      if (bp.y >= bp.groundY && bp.vy > 0) {
        bp.y = bp.groundY;
        if (bp.bounces < 1 && Math.abs(bp.vy) > 100) {
          bp.vy = -bp.vy * 0.35; bp.vx *= 0.7; bp.rotSpeed *= 0.6; bp.bounces++;
          for (let i = 0; i < 3; i++) spawnParticle(bp.x, bp.y, (Math.random()-0.5)*60, -Math.random()*40, bp.bloodied ? '#991b1b' : 'rgba(148,163,184,0.6)', 0.4, 2, 'front', 300);
        } else {
          bp.landed = true; bp.vy = 0; bp.vx *= 0.25; bp.rotSpeed = 0;
          if (bp.bloodied) G.splatters.push({ x: bp.x, y: bp.y + 2, r: 4 + Math.random() * 6, color: '#7f1d1d', life: 3.5, maxLife: 3.5 });
        }
      }
    } else { bp.x += bp.vx * dt; bp.vx *= Math.pow(0.05, dt); }
  }
  G.bodyParts = G.bodyParts.filter(bp => bp.life > 0);
}

function drawXEye(cx, cy, size) {
  ctx.beginPath();
  ctx.moveTo(cx - size, cy - size); ctx.lineTo(cx + size, cy + size);
  ctx.moveTo(cx + size, cy - size); ctx.lineTo(cx - size, cy + size);
  ctx.stroke();
}

function drawBodyPart(bp) {
  const fadeStart = 1.5;
  const alpha = bp.life > fadeStart ? 1 : Math.max(0, bp.life / fadeStart);
  ctx.save();
  ctx.translate(bp.x, bp.y);
  ctx.rotate(bp.rotation);
  ctx.globalAlpha = alpha;
  const p = bp.part;
  const t = bp.partType;

  if (t === 'head') {
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(0, 0, p.size, 0, Math.PI * 2); ctx.fill();
    if (p.accentType === 'helm') {
      ctx.fillStyle = p.accent;
      ctx.beginPath(); ctx.arc(0, 0, p.size + 1, Math.PI, 0); ctx.lineTo(p.size + 1, -1); ctx.lineTo(-p.size - 1, -1); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#f1c40f';
      ctx.beginPath(); ctx.moveTo(0, -p.size); ctx.quadraticCurveTo(-4, -p.size - 10, 0, -p.size - 14); ctx.quadraticCurveTo(4, -p.size - 10, 0, -p.size); ctx.closePath(); ctx.fill();
    } else if (p.accentType === 'hood') {
      ctx.fillStyle = p.accent;
      ctx.beginPath(); ctx.arc(0, -1, p.size + 2, Math.PI, 0); ctx.lineTo(p.size + 2, -1); ctx.lineTo(-p.size - 2, -1); ctx.closePath(); ctx.fill();
    } else if (p.accentType === 'hat') {
      ctx.fillStyle = p.accent;
      ctx.beginPath(); ctx.moveTo(-p.size - 2, -p.size * 0.3); ctx.lineTo(p.size + 2, -p.size * 0.3); ctx.lineTo(p.size * 0.3, -p.size * 1.9); ctx.lineTo(0, -p.size * 2.2); ctx.lineTo(-p.size * 0.3, -p.size * 1.9); ctx.closePath(); ctx.fill();

    } else if (p.accentType === 'bandana') {
      ctx.fillStyle = p.accent;
      ctx.beginPath(); ctx.arc(0, -2, p.size + 1, Math.PI, 0); ctx.lineTo(p.size + 1, -2); ctx.lineTo(-p.size - 1, -2); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(-p.size - 1, -2, 3, 0, Math.PI * 2); ctx.fill();
    } else if (p.accentType === 'horns') {
      ctx.fillStyle = p.accent;
      ctx.beginPath(); ctx.moveTo(-p.size*0.5, -p.size*0.7); ctx.quadraticCurveTo(-p.size*1.3, -p.size*1.6, -p.size*1.5, -p.size*1.1); ctx.quadraticCurveTo(-p.size*0.9, -p.size*0.7, -p.size*0.4, -p.size*0.4); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(p.size*0.5, -p.size*0.7); ctx.quadraticCurveTo(p.size*1.3, -p.size*1.6, p.size*1.5, -p.size*1.1); ctx.quadraticCurveTo(p.size*0.9, -p.size*0.7, p.size*0.4, -p.size*0.4); ctx.closePath(); ctx.fill();
    } else if (p.accentType === 'tusks') {
      ctx.fillStyle = p.accent;
      ctx.beginPath(); ctx.moveTo(-p.size*0.4, p.size*0.2); ctx.lineTo(-p.size*0.6, p.size*0.9); ctx.lineTo(-p.size*0.2, p.size*0.35); ctx.closePath(); ctx.fill();

    } else if (p.accentType === 'halo') {

    }
    ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 1.7; ctx.lineCap = 'round';

    drawXEye( p.size * 0.35, -p.size * 0.05, 2.4);
    ctx.beginPath(); ctx.arc(0, p.size * 0.35, 3, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
    ctx.fillStyle = 'rgba(185, 28, 28, 0.65)';

    ctx.beginPath(); ctx.arc(p.size * 0.15, p.size * 0.6, 1.6, 0, Math.PI * 2); ctx.fill();
  } else if (t === 'arm' || t === 'leg') {

    ctx.beginPath(); ctx.arc(0, -p.h/2 + 2, p.w * 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.arc(0, p.h/2 - 2, p.w * 0.45, 0, Math.PI * 2); ctx.fill();
  } else if (t === 'torso') {
    ctx.fillStyle = p.color;
    roundRect(-p.w/2, -p.h/2, p.w, p.h, p.w * 0.3); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.arc(0, -p.h/2 + 3, p.w * 0.35, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(220, 38, 38, 0.7)';
    ctx.beginPath(); ctx.arc(0, -p.h/2 + 3, p.w * 0.22, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.arc(-p.w/2 + 2, -p.h*0.15, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc( p.w/2 - 2, -p.h*0.15, 3, 0, Math.PI * 2); ctx.fill();
  } else if (t === 'brick') {
    ctx.fillStyle = p.color;
    roundRect(-p.w/2, -p.h/2, p.w, p.h, 2); ctx.fill();
    ctx.strokeStyle = 'rgba(15, 23, 42, 0.5)'; ctx.lineWidth = 1;
    roundRect(-p.w/2, -p.h/2, p.w, p.h, 2); ctx.stroke();
  }
  ctx.restore();
}

function updateSplatters(dt) {
  for (const s of G.splatters) s.life -= dt;
  G.splatters = G.splatters.filter(s => s.life > 0);
}
function drawSplatters() {
  for (const s of G.splatters) {
    const a = Math.max(0, s.life / s.maxLife) * 0.75;
    ctx.globalAlpha = a;
    ctx.fillStyle = s.color;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.scale(1, 0.5);
    ctx.beginPath(); ctx.arc(0, 0, s.r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function updateParticles(dt) {
  for (const p of G.particles) {
    p.vy += p.gravity * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    const drag = Math.pow(0.15, dt);
    p.vx *= drag; p.vy *= drag;
    p.life -= dt;
  }
  G.particles = G.particles.filter(p => p.life > 0);
}
function drawParticles(layer) {
  for (const p of G.particles) {
    if (p.layer !== layer) continue;
    const a = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.4 + a * 0.6), 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

const FIGURE_Y_OFFSET = -8;

function drawFigure(kind, x, y, facing, time, flash, walkPhase, moving, atkP, spawnP, deathP) {
  if (spawnP === undefined) spawnP = 1;
  if (deathP === undefined) deathP = 0;
  ctx.save();
  ctx.translate(x, y + FIGURE_Y_OFFSET);
  if (spawnP < 1) {
    const s = easeOutBack(Math.max(0, spawnP));
    ctx.globalAlpha = Math.max(0, Math.min(1, spawnP * 1.4));
    ctx.scale(s, s);
  }
  ctx.save();
  ctx.scale(1, 0.27);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.arc(0, 0 - FIGURE_Y_OFFSET, 26, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.scale(facing, 1);
  if (deathP > 0) {
    ctx.rotate(-deathP * 1.2);
    ctx.globalAlpha = (ctx.globalAlpha || 1) * Math.max(0, 1 - deathP * 0.85);
    ctx.translate(0, deathP * 12);
  }
  if (flash) ctx.globalAlpha = Math.min(ctx.globalAlpha || 1, 0.55);

  const a = atkP || 0;
  if (a > 0) {
    const stretch = Math.sin(a * Math.PI);
    ctx.scale(1 - stretch * 0.04, 1 + stretch * 0.08);
  }

  const anim = {
    walkPhase: walkPhase || 0, moving: !!moving, atkP: a,
    atkSwing: a > 0 ? Math.sin(a * Math.PI) : 0,
    charge:  a > 0 ? Math.min(a * 2, 1) : 0,
    release: a > 0 ? Math.max(a * 2 - 1, 0) : 0,
    attackRotate: attackRotate(a)
  };
  switch (kind) {
    case 'sword':    drawBoyar(time, anim);    break;
    case 'archer':   drawLuchnik(time, anim);    break;
    case 'mage':     drawVolhv(time, anim);      break;
    case 'wall':     drawOstrog();                break;
    case 'bomb':     drawZeleyshchik(time, anim);    break;
    case 'spearman': drawOpolchenets(time, anim);  break;
    case 'assassin': drawRazboynik(time, anim);  break;
    case 'healer':   drawLekar(time, anim);    break;
    case 'fanatic':  drawStarobryadets(time, anim);   break;
    case 'shepherd': drawBatyushka(time, anim);  break;
    case 'strelets': drawStrelets(time, anim);  break;
    case 'tower':    drawSrub();               break;
    case 'mortar':   drawPushka(time, anim);    break;
    default:         drawEnemyByType(kind, time, anim); break;
  }
  ctx.restore();
}
function bodyPose(time, anim, freq) {
  const idleBob = Math.sin(time * (freq || 3)) * 1.2;
  const walkBob = anim.moving ? Math.abs(Math.sin(anim.walkPhase)) * 2.5 : 0;
  const bob = anim.moving ? walkBob : idleBob;
  const lunge = anim.atkSwing * 8;
  const legSwing = anim.moving ? Math.sin(anim.walkPhase) * 5 : 0;
  const walkTilt = anim.moving ? Math.sin(anim.walkPhase) * 0.035 : 0;
  return { bob, lunge, legSwing, walkTilt };
}

function drawOstrog() {
  ctx.save(); ctx.translate(0, -10);
  const x0 = -45, x1 = 45, y0 = -60, y1 = 20; const w = x1 - x0;
  
  // Земля
  ctx.fillStyle = '#3e2723'; ctx.fillRect(x0, y0 + 40, w, 40);
  
  // ИСПРАВЛЕНО: Бревна (частокол) без дрожания (используем детерминированную высоту)
  let postIdx = 0;
  for (let x = x0; x < x1; x += 14, postIdx++) {
    // Детерминированная высота для ровных, но разных бревен
    const bh = 40 + ((postIdx * 13) % 20); 
    const baseGrad = ctx.createLinearGradient(x, 0, x + 14, 0);
    baseGrad.addColorStop(0, '#8e5a3b'); baseGrad.addColorStop(0.5, '#6e3a1b'); baseGrad.addColorStop(1, '#4a2511');
    ctx.fillStyle = baseGrad;
    
    // Заостренные верхушки
    ctx.beginPath();
    ctx.moveTo(x, y1);
    ctx.lineTo(x, y0 + 40 - bh);
    ctx.lineTo(x + 7, y0 + 40 - bh - 15);
    ctx.lineTo(x + 14, y0 + 40 - bh);
    ctx.lineTo(x + 14, y1);
    ctx.closePath();
    ctx.fill();
    
    // Текстура дерева
    ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x + 3, y0 + 40); ctx.lineTo(x + 3, y0 + 40 - bh); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 10, y0 + 40); ctx.lineTo(x + 10, y0 + 40 - bh); ctx.stroke();
  }
  
  // Поперечные балки
  ctx.fillStyle = '#4a2511';
  ctx.fillRect(x0 - 5, y0 + 20, w + 10, 8);
  ctx.fillRect(x0 - 5, y1 - 15, w + 10, 8);
  
  ctx.restore();
}

  // Ствол пищали (смотрит вверх)
  ctx.save();
  ctx.translate(aimX, aimY);
  ctx.rotate(-0.1 - anim.release * 0.2);
  
  // Деревянный приклад
  ctx.fillStyle = '#6e2c00';
  ctx.beginPath(); ctx.moveTo(-12, 2); ctx.lineTo(2, 0); ctx.lineTo(4, 6); ctx.lineTo(-6, 10); ctx.closePath(); ctx.fill();
  
  // Ствол
  const barrelGrad = ctx.createLinearGradient(0, -2, 0, 4);
  barrelGrad.addColorStop(0, '#bdc3c7'); barrelGrad.addColorStop(1, '#7f8c8d');
  ctx.fillStyle = barrelGrad;
  ctx.fillRect(2, 0, 42, 4);
  
  // Расширение на конце (мушкетон)
  ctx.fillStyle = '#95a5a6';
  ctx.beginPath(); ctx.moveTo(42, -1); ctx.lineTo(46, -2); ctx.lineTo(46, 6); ctx.lineTo(42, 5); ctx.closePath(); ctx.fill();
  
  // Замок
  ctx.fillStyle = '#d5d8dc'; ctx.fillRect(8, 2, 6, 4);
  ctx.fillStyle = '#2c3e50'; ctx.fillRect(10, 0, 2, 2);

  // Дуло
  ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.ellipse(46, 2, 1, 3, 0, 0, Math.PI * 2); ctx.fill();

  // ИСПРАВЛЕНО: Плавный пороховой дым (без Math.random())
  if (anim.release > 0.1 && anim.release < 0.6) {
    const flashA = 1 - Math.abs(anim.release - 0.35) / 0.25;
    const flashGrad = ctx.createRadialGradient(48, 2, 0, 48, 2, 20);
    flashGrad.addColorStop(0, `rgba(255, 255, 255, ${flashA})`);
    flashGrad.addColorStop(0.4, `rgba(241, 196, 15, ${flashA * 0.8})`);
    flashGrad.addColorStop(1, 'rgba(211, 84, 0, 0)');
    ctx.fillStyle = flashGrad;
    ctx.beginPath(); ctx.arc(48, 2, 20, 0, Math.PI * 2); ctx.fill();
    
    // Дым
    for (let i = 0; i < 4; i++) {
      const dx = 50 + i * 6 + (Math.sin(time * 30 + i) * 3);
      const dy = (Math.cos(time * 25 + i) * 8);
      const dr = 5 + i * 2 + Math.sin(time * 20 + i) * 2;
      ctx.fillStyle = `rgba(189, 195, 199, ${flashA * 0.5})`;
      ctx.beginPath(); ctx.arc(dx, dy, dr, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
  
  // Передняя рука
  ctx.strokeStyle = '#922b21'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, -40); ctx.lineTo(aimX + 14, aimY + 2); ctx.stroke();
  ctx.fillStyle = '#fde68a'; ctx.beginPath(); ctx.arc(aimX + 14, aimY + 2, 3.5, 0, Math.PI * 2); ctx.fill();
  
  ctx.restore();
}

function drawSrub() {
  ctx.save(); ctx.translate(0, -15);
  const x0 = -28, x1 = 28, y0 = -55, y1 = 25;
  const w = x1 - x0;
  
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(0, y1, w * 0.6, 6, 0, 0, Math.PI * 2); ctx.fill();
  
  // Сруб (бревенчатая башня)
  const baseGrad = ctx.createLinearGradient(0, y0, 0, y1);
  baseGrad.addColorStop(0, '#8e5a3b'); baseGrad.addColorStop(1, '#4a2511');
  ctx.fillStyle = baseGrad; ctx.fillRect(x0, y0, w, y1 - y0);
  
  // Текстура бревен
  ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 2;
  for (let y = y0 + 10; y < y1; y += 12) {
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
  }
  
  // Крыша (деревянная)
  ctx.fillStyle = '#6e2c00';
  ctx.beginPath(); ctx.moveTo(x0 - 6, y0); ctx.lineTo(0, y0 - 25); ctx.lineTo(x1 + 6, y0); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#3e1a00'; ctx.lineWidth = 1.5; ctx.stroke();
  
  // Окно (бойница)
  ctx.fillStyle = '#0f172a'; ctx.fillRect(-6, y0 + 10, 12, 14);
  
  // Флаг
  ctx.strokeStyle = '#3e1a00'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, y0 - 25); ctx.lineTo(0, y0 - 45); ctx.stroke();
  const wave = Math.sin(G.time * 4) * 2;
  ctx.fillStyle = '#c0392b';
  ctx.beginPath();
  ctx.moveTo(0, y0 - 45);
  ctx.quadraticCurveTo(12, y0 - 43 + wave, 16, y0 - 35);
  ctx.lineTo(0, y0 - 30);
  ctx.closePath(); ctx.fill();
  
  ctx.restore();
}

function drawPushka(time, anim) {
  ctx.save(); ctx.translate(0, -28);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(0, 26, 30, 7, 0, 0, Math.PI * 2); ctx.fill();
  
  // Деревянный лафет
  ctx.fillStyle = '#6e2c00';
  roundRect(-26, 8, 52, 16, 4); ctx.fill();
  ctx.strokeStyle = '#3e1a00'; ctx.lineWidth = 1.5;
  roundRect(-26, 8, 52, 16, 4); ctx.stroke();
  
  // Колеса
  ctx.fillStyle = '#1c1917';
  ctx.beginPath(); ctx.arc(-14, 24, 7, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(14, 24, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#7f8c8d';
  ctx.beginPath(); ctx.arc(-14, 24, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(14, 24, 3, 0, Math.PI * 2); ctx.fill();
  
  // Ствол пушки
  const barrelAngle = -Math.PI / 4 - anim.charge * 0.3 + anim.release * 0.5;
  ctx.save();
  ctx.translate(-6, 4);
  ctx.rotate(barrelAngle);
  
  const barrelGrad = ctx.createLinearGradient(0, -10, 0, 10);
  barrelGrad.addColorStop(0, '#bdc3c7'); barrelGrad.addColorStop(0.5, '#7f8c8d'); barrelGrad.addColorStop(1, '#34495e');
  ctx.fillStyle = barrelGrad;
  roundRect(-12, -9, 40, 18, 4); ctx.fill();
  
  ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 1.5;
  roundRect(-12, -9, 40, 18, 4); ctx.stroke();
  
  // Резьба
  ctx.strokeStyle = '#95a5a6'; ctx.lineWidth = 2;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath(); ctx.moveTo(-2 + i * 12, -9); ctx.lineTo(-2 + i * 12, 9); ctx.stroke();
  }
  
  // Раструб
  ctx.fillStyle = '#0f172a';
  ctx.beginPath(); ctx.ellipse(28, 0, 3, 9, 0, 0, Math.PI * 2); ctx.fill();
  
  // Вспышка при выстреле
  if (anim.release > 0.1 && anim.release < 0.5) {
    const flashA = 1 - Math.abs(anim.release - 0.3) / 0.2;
    const flashR = 18 * (1 - anim.release) + 5;
    const flashGrad = ctx.createRadialGradient(32, 0, 0, 32, 0, flashR);
    flashGrad.addColorStop(0, `rgba(254, 240, 138, ${flashA})`);
    flashGrad.addColorStop(0.5, `rgba(251, 146, 60, ${flashA * 0.6})`);
    flashGrad.addColorStop(1, 'rgba(220, 38, 38, 0)');
    ctx.fillStyle = flashGrad;
    ctx.beginPath(); ctx.arc(32, 0, flashR, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  ctx.restore();
}

function drawEnemyByType(kind, time, anim) {
  const cfg = ENEMY_TYPES[kind] || ENEMY_TYPES.goblin;
  const s = cfg.scale;
  const skin = cfg.skin, dark = cfg.dark, darker = cfg.darker;
  const { bob, lunge, legSwing, walkTilt } = bodyPose(time, anim, 4);

  ctx.fillStyle = dark;
  ctx.fillRect(-9*s - legSwing, -16*s, 7*s, 14*s);
  ctx.fillRect(2*s + legSwing, -16*s, 7*s, 14*s);
  ctx.fillStyle = darker;
  ctx.beginPath();
  ctx.ellipse(-5.5*s - legSwing, -3*s, 6.5*s, 3.5*s, 0, 0, Math.PI * 2);
  ctx.ellipse(5.5*s + legSwing, -3*s, 6.5*s, 3.5*s, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(lunge, -bob);
  ctx.rotate(walkTilt);

  const bodyGrad = ctx.createLinearGradient(0, -52*s, 0, -14*s);
  bodyGrad.addColorStop(0, skin); bodyGrad.addColorStop(1, dark);
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.moveTo(-14*s, -50*s); ctx.lineTo(14*s, -50*s);
  ctx.lineTo(12*s, -16*s); ctx.lineTo(-12*s, -16*s);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = darker;
  ctx.beginPath(); ctx.moveTo(-14*s, -44*s); ctx.lineTo(-7*s, -47*s); ctx.lineTo(-10*s, -36*s); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(14*s, -30*s); ctx.lineTo(8*s, -33*s); ctx.lineTo(11*s, -22*s); ctx.closePath(); ctx.fill();

  ctx.fillStyle = '#1c1917'; ctx.fillRect(-12*s, -24*s, 24*s, 4*s);
  ctx.fillStyle = '#a16207'; ctx.beginPath(); ctx.arc(0, -22*s, 2*s, 0, Math.PI * 2); ctx.fill();

  const headSize = 10 * s;
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(0, -58*s, headSize, 0, Math.PI * 2); ctx.fill();

  if (kind === 'goblin' || kind === 'orc') {
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.moveTo(-9*s, -60*s); ctx.lineTo(-17*s, -67*s); ctx.lineTo(-8*s, -55*s); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(9*s, -60*s); ctx.lineTo(17*s, -67*s); ctx.lineTo(8*s, -55*s); ctx.closePath(); ctx.fill();
  }

  if (kind === 'goblin' || kind === 'troll' || kind === 'demon') {
    ctx.fillStyle = darker;
    ctx.beginPath();
    ctx.moveTo(-6*s, -67*s);
    ctx.quadraticCurveTo(-9*s, -76*s, -13*s, -73*s);
    ctx.quadraticCurveTo(-9*s, -71*s, -6*s, -67*s);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(6*s, -67*s);
    ctx.quadraticCurveTo(9*s, -76*s, 13*s, -73*s);
    ctx.quadraticCurveTo(9*s, -71*s, 6*s, -67*s);
    ctx.closePath(); ctx.fill();
  } else if (kind === 'orc' || kind === 'shaman') {
    ctx.fillStyle = kind === 'shaman' ? '#8e44ad' : darker;
    ctx.beginPath();
    ctx.moveTo(-6*s, -67*s);
    ctx.quadraticCurveTo(-10*s, -79*s, -15*s, -76*s);
    ctx.quadraticCurveTo(-10*s, -71*s, -6*s, -66*s);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(6*s, -67*s);
    ctx.quadraticCurveTo(10*s, -79*s, 15*s, -76*s);
    ctx.quadraticCurveTo(10*s, -71*s, 6*s, -66*s);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = kind === 'shaman' ? '#a78bfa' : '#7dd3fc';
    ctx.beginPath(); ctx.arc(-15*s, -76*s, 1.5*s, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(15*s, -76*s, 1.5*s, 0, Math.PI * 2); ctx.fill();
  }

  if (kind === 'demon') {
    ctx.fillStyle = darker;
    ctx.beginPath(); ctx.moveTo(-13*s, -44*s); ctx.quadraticCurveTo(-32*s, -52*s, -28*s, -30*s); ctx.quadraticCurveTo(-22*s, -34*s, -18*s, -28*s); ctx.quadraticCurveTo(-16*s, -38*s, -13*s, -44*s); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(13*s, -44*s); ctx.quadraticCurveTo(32*s, -52*s, 28*s, -30*s); ctx.quadraticCurveTo(22*s, -34*s, 18*s, -28*s); ctx.quadraticCurveTo(16*s, -38*s, 13*s, -44*s); ctx.closePath(); ctx.fill();
  }

  ctx.fillStyle = kind === 'demon' ? '#fbbf24' : '#fde047';
  ctx.beginPath();
  ctx.arc(-3*s, -59*s, 2.2*s, 0, Math.PI * 2);
  ctx.arc(3*s, -59*s, 2.2*s, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.arc(-2.5*s, -59*s, 1.1*s, 0, Math.PI * 2);
  ctx.arc(3.5*s, -59*s, 1.1*s, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = darker; ctx.lineWidth = 2*s; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-6*s, -64*s); ctx.lineTo(-1*s, -62*s);
  ctx.moveTo(6*s, -64*s);  ctx.lineTo(1*s, -62*s);
  ctx.stroke();

  ctx.fillStyle = darker;
  ctx.beginPath(); ctx.arc(0, -52*s, 4*s, 0, Math.PI); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.moveTo(-3*s, -52*s); ctx.lineTo(-2*s, -49*s); ctx.lineTo(-1*s, -52*s); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(1*s, -52*s); ctx.lineTo(2*s, -49*s); ctx.lineTo(3*s, -52*s); ctx.closePath(); ctx.fill();

  if (kind === 'orc') {
    ctx.fillStyle = '#fef3c7';
    ctx.beginPath(); ctx.moveTo(-4*s, -53*s); ctx.lineTo(-6*s, -46*s); ctx.lineTo(-2*s, -52*s); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(4*s, -53*s); ctx.lineTo(6*s, -46*s); ctx.lineTo(2*s, -52*s); ctx.closePath(); ctx.fill();
  }

  if (kind === 'shaman') {
    ctx.save();
    ctx.translate(-12*s, -42*s);
    ctx.rotate(-anim.atkSwing * 0.9);
    ctx.strokeStyle = '#3e1a00'; ctx.lineWidth = 3*s; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 20*s); ctx.lineTo(0, -18*s); ctx.stroke();
    
    ctx.fillStyle = '#f0f0f0';
    ctx.beginPath(); ctx.arc(0, -22*s, 5*s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(-2*s, -22*s, 1.2*s, 0, Math.PI * 2); ctx.arc(2*s, -22*s, 1.2*s, 0, Math.PI * 2); ctx.fill();
    
    const glow = 0.7 + Math.sin(time * 5) * 0.3 + anim.atkSwing * 0.7;
    const glowGrad = ctx.createRadialGradient(0, -22*s, 0, 0, -22*s, 12*s + anim.atkSwing * 8*s);
    glowGrad.addColorStop(0, `rgba(46, 204, 113, ${glow})`);
    glowGrad.addColorStop(1, 'rgba(39, 174, 96, 0)');
    ctx.fillStyle = glowGrad;
    ctx.beginPath(); ctx.arc(0, -22*s, 12*s + anim.atkSwing * 8*s, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  } else if (kind === 'troll') {
    ctx.save();
    ctx.translate(12*s, -42*s);
    ctx.rotate(-anim.attackRotate * 0.8 - 0.2);
    ctx.strokeStyle = dark; ctx.lineWidth = 8*s; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(6*s, -8*s); ctx.stroke();
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.arc(6*s, -8*s, 5*s, 0, Math.PI * 2); ctx.fill();
    ctx.translate(6*s, -8*s);
    ctx.fillStyle = '#4a2511';
    ctx.fillRect(-3*s, -30*s, 6*s, 26*s);
    ctx.fillStyle = '#2c1600';
    ctx.beginPath(); ctx.arc(0, -32*s, 8*s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#7f8c8d';
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2 + time * 0.5;
      const sx = Math.cos(a) * 8*s;
      const sy = -32*s + Math.sin(a) * 8*s;
      ctx.beginPath(); ctx.arc(sx, sy, 1.8*s, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  } else if (kind === 'orc') {
    ctx.save();
    ctx.translate(12*s, -42*s);
    ctx.rotate(-anim.attackRotate * 0.8 - 0.2);
    ctx.strokeStyle = dark; ctx.lineWidth = 6*s; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(8*s, -4*s); ctx.stroke();
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.arc(8*s, -4*s, 3.5*s, 0, Math.PI * 2); ctx.fill();
    ctx.translate(8*s, -4*s);
    
    // Дубина упыря
    ctx.fillStyle = '#4a2511';
    ctx.fillRect(-2*s, -26*s, 4*s, 30*s);
    ctx.fillStyle = '#7f8c8d';
    ctx.beginPath();
    ctx.moveTo(2*s, -24*s);
    ctx.lineTo(13*s, -28*s);
    ctx.lineTo(14*s, -16*s);
    ctx.lineTo(2*s, -16*s);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  } else if (kind === 'demon') {
    ctx.save();
    ctx.translate(12*s, -42*s);
    ctx.rotate(-anim.attackRotate * 0.9 - 0.2);
    ctx.strokeStyle = dark; ctx.lineWidth = 6*s; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(8*s, -4*s); ctx.stroke();
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.arc(8*s, -4*s, 4*s, 0, Math.PI * 2); ctx.fill();
    ctx.translate(8*s, -4*s);
    
    // Посох Кощея
    ctx.fillStyle = '#b8860b';
    ctx.fillRect(-1.5*s, -30*s, 3*s, 26*s);
    const tipGlow = 0.6 + Math.sin(time * 8) * 0.4;
    const tipGrad = ctx.createRadialGradient(0, -30*s, 0, 0, -30*s, 9*s);
    tipGrad.addColorStop(0, `rgba(255, 0, 0, ${tipGlow})`);
    tipGrad.addColorStop(1, 'rgba(139, 0, 0, 0)');
    ctx.fillStyle = tipGrad;
    ctx.beginPath(); ctx.arc(0, -30*s, 9*s, 0, Math.PI * 2); ctx.fill();
    
    // Череп на посохе
    ctx.fillStyle = '#f0f0f0';
    ctx.beginPath(); ctx.arc(0, -30*s, 5*s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(-2*s, -31*s, 1.5*s, 0, Math.PI * 2); ctx.arc(2*s, -31*s, 1.5*s, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  } else {
    ctx.save();
    ctx.translate(12*s, -42*s);
    ctx.rotate(-anim.attackRotate * 0.8 - 0.2);
    ctx.strokeStyle = dark; ctx.lineWidth = 6*s; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(10*s, -2*s); ctx.stroke();
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.arc(10*s, -2*s, 4*s, 0, Math.PI * 2); ctx.fill();
    ctx.translate(10*s, -2*s);
    
    // Когти беса
    ctx.fillStyle = '#6e2c00';
    ctx.fillRect(-1.5*s, -4*s, 3*s, 6*s);
    ctx.fillStyle = '#d5d8dc';
    ctx.beginPath();
    ctx.moveTo(-2*s, -4*s); ctx.lineTo(2*s, -4*s);
    ctx.lineTo(1*s, -20*s); ctx.lineTo(0, -24*s); ctx.lineTo(-1*s, -20*s);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  ctx.restore();
}

function drawCastle() {
  const cx = CASTLE_X;
  const top = CASTLE_TOP;
  const bottom = CASTLE_BOTTOM;
  const w = CASTLE_W;
  const x0 = cx - w / 2;
  const x1 = x0 + w;

  let shakeX = 0, shakeY = 0;
  if (G.castleFlashUntil > G.time) {
    const t = (G.castleFlashUntil - G.time) / 0.25;
    shakeX = (Math.random() - 0.5) * 6 * t;
    shakeY = (Math.random() - 0.5) * 4 * t;
  }

  ctx.save();
  ctx.translate(shakeX, shakeY);

  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.ellipse(cx, bottom, w * 0.55, 7, 0, 0, Math.PI * 2); ctx.fill();

  // Белокаменное основание
  const baseGrad = ctx.createLinearGradient(0, top, 0, bottom);
  baseGrad.addColorStop(0, '#fdfefe'); baseGrad.addColorStop(0.5, '#d5dbdb'); baseGrad.addColorStop(1, '#aab7b8');
  ctx.fillStyle = baseGrad; ctx.fillRect(x0, top, w, bottom - top);

  // Кладка белого камня
  ctx.strokeStyle = 'rgba(150, 150, 150, 0.5)'; ctx.lineWidth = 1;
  for (let y = top + 16; y < bottom; y += 16) {
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
  }
  for (let y = top, i = 0; y < bottom; y += 16, i++) {
    const offset = (i % 2) * 14;
    for (let x = x0 + offset + 14; x < x1; x += 28) {
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 16); ctx.stroke();
    }
  }

  // Деревянный частокол сверху
  const woodTop = top - 15;
  ctx.fillStyle = '#6e2c00';
  ctx.fillRect(x0, woodTop, w, 15);
  ctx.strokeStyle = '#3e1a00'; ctx.lineWidth = 1;
  for (let x = x0; x < x1; x += 8) {
    ctx.beginPath(); ctx.moveTo(x, woodTop); ctx.lineTo(x, top); ctx.stroke();
  }

  // Центральная башня (Детинец)
  const towerW = 40;
  const towerTop = woodTop - 60;
  ctx.fillStyle = '#d5dbdb';
  ctx.fillRect(cx - towerW/2, towerTop, towerW, 60);
  ctx.strokeStyle = '#aab7b8'; ctx.lineWidth = 1;
  for (let y = towerTop + 10; y < woodTop; y += 10) {
    ctx.beginPath(); ctx.moveTo(cx - towerW/2, y); ctx.lineTo(cx + towerW/2, y); ctx.stroke();
  }

  // Луковичный купол
  ctx.fillStyle = '#b8860b';
  ctx.beginPath();
  ctx.moveTo(cx - towerW/2 - 2, towerTop);
  ctx.quadraticCurveTo(cx - towerW/2 + 5, towerTop - 30, cx, towerTop - 45);
  ctx.quadraticCurveTo(cx + towerW/2 - 5, towerTop - 30, cx + towerW/2 + 2, towerTop);
  ctx.closePath();
  ctx.fill();

  ctx.quadraticCurveTo(cx, bottom - 45, cx + 15, bottom - 30);

    grd.addColorStop(1, 'rgba(250, 204, 21, 0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(fx, fy, 18 * t + 5, 0, Math.PI * 2); ctx.fill();
  }

  ctx.restore();

  const barW = w + 30;

  roundRect(barX, barY, barW, barH, 4); ctx.fill();
  const hpPct = Math.max(0, G.castleHp / G.castleMaxHp);

    const fillColor = hpPct > 0.6 ? '#f1c40f' : hpPct > 0.3 ? '#e67e22' : '#c0392b';
    ctx.fillStyle = fillColor;
    roundRect(barX, barY, barW * hpPct, barH, 4); ctx.fill();
  }
  ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 2;
  roundRect(barX, barY, barW, barH, 4); ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 12px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(Math.ceil(G.castleHp) + '/' + G.castleMaxHp, cx, barY + barH / 2 + 1);
}

function drawMagicStream(s) {
  if (!s.target) return;
  const a = Math.max(0, Math.min(1, s.life / s.maxLife));
  const alpha = a < 0.5 ? a * 2 : (1 - a) * 2;
  const endX = s.target.x, endY = s.target.y - 20;
  const dx = endX - s.startX, dy = endY - s.startY;
  const len = Math.sqrt(dx * dx + dy * dy) || 1;
  const nx = dx / len, ny = dy / len;
  const px = -ny, py = nx;
  const t = G.time + s.seed;
  drawMagicWave(s.startX, s.startY, nx, ny, px, py, len, t, 14, `rgba(142, 68, 173, ${alpha * 0.28})`, 0.7, 5);
  drawMagicWave(s.startX, s.startY, nx, ny, px, py, len, t, 7, `rgba(167, 139, 250, ${alpha * 0.75})`, 1.4, 3);
  drawMagicWave(s.startX, s.startY, nx, ny, px, py, len, t, 3, `rgba(254, 243, 199, ${alpha})`, 2.2, 1.5);
  drawMagicWave(s.startX, s.startY, nx, ny, px, py, len, t, 1.4, `rgba(255, 255, 255, ${alpha})`, 2.8, 0.8);
  const endPulse = 0.7 + Math.sin(t * 30) * 0.3;
  const endR = 14 + endPulse * 8;
  const endGrad = ctx.createRadialGradient(endX, endY, 0, endX, endY, endR);
  endGrad.addColorStop(0, `rgba(255, 255, 255, ${alpha * 0.9})`);
  endGrad.addColorStop(0.4, `rgba(196, 181, 253, ${alpha * 0.7})`);
  endGrad.addColorStop(1, 'rgba(142, 68, 173, 0)');
  ctx.fillStyle = endGrad; ctx.beginPath(); ctx.arc(endX, endY, endR, 0, Math.PI * 2); ctx.fill();
  const startR = 12 + Math.sin(t * 25) * 3;
  const startGrad = ctx.createRadialGradient(s.startX, s.startY, 0, s.startX, s.startY, startR);
  startGrad.addColorStop(0, `rgba(255, 255, 255, ${alpha})`);
  startGrad.addColorStop(0.5, `rgba(196, 181, 253, ${alpha * 0.6})`);
  startGrad.addColorStop(1, 'rgba(142, 68, 173, 0)');
  ctx.fillStyle = startGrad; ctx.beginPath(); ctx.arc(s.startX, s.startY, startR, 0, Math.PI * 2); ctx.fill();
  if (Math.random() < 0.6) {
    const u = Math.random();
    const amp = Math.sin(u * Math.PI) * 8;
    const wave = Math.sin(t * 25 + u * 20) * amp;
    const ppx = s.startX + nx * len * u + px * wave;
    const ppy = s.startY + ny * len * u + py * wave;
    spawnParticle(ppx, ppy, (Math.random() - 0.5) * 40, (Math.random() - 0.5) * 40, Math.random() < 0.5 ? '#c4b5fd' : '#f0abfc', 0.35, 1.5 + Math.random() * 2, 'front', 0);
  }
}
function drawMagicWave(x0, y0, nx, ny, px, py, len, t, width, color, freqMult, ampBase) {
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  const segments = 22;
  for (let i = 0; i <= segments; i++) {
    const u = i / segments;
    const env = Math.sin(u * Math.PI);
    const noise = Math.sin(t * 14 + u * 9 * freqMult) * (ampBase + Math.sin(t * 22 + u * 3) * 2);
    const wave = noise * env;
    const x = x0 + nx * len * u + px * wave;
    const y = y0 + ny * len * u + py * wave;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
}
